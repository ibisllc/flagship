name = "flagship-inference-shim"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Public host the box reaches (put this host — NOT vLLM — in .com's
# FLAGSHIP_INFERENCE_ENDPOINT.baseUrl). Bind a custom domain in the
# dashboard or via a route, e.g. inference.flagshipserver.com.
# routes = [{ pattern = "inference.flagshipserver.com", custom_domain = true }]

[vars]
# Private vLLM base. Pod: "http://<pod-ip>:8000". RunPod Serverless:
# "https://api.runpod.ai/v2/<ENDPOINT_ID>/openai".
VLLM_UPSTREAM = "http://REPLACE-ME:8000"
COM_BASE_URL = "https://flagshipserver.com"

# Secrets (set with `wrangler secret put`, NOT here):
#   FLAGSHIP_INFERENCE_TOKEN_SECRET  — SAME value as apps/com's secret.
#   VLLM_UPSTREAM_KEY                 — only for RunPod Serverless (API key).

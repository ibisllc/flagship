name = "flagship-inference-shim"
main = "src/index.ts"
compatibility_date = "2024-11-01"
# The shim calls .com, another Worker on the same zone: without this flag
# that fetch fails (error 1042) instead of reaching the .com Worker.
compatibility_flags = ["global_fetch_strictly_public"]

# Public host the box reaches (put this host in .com's
# FLAGSHIP_INFERENCE_ENDPOINT.baseUrl). Bind a custom domain in the
# dashboard or uncomment:
# routes = [{ pattern = "inference.flagshipserver.com", custom_domain = true }]

[vars]
# Two OpenAI-compatible upstreams, both in the US (a user-selectable US/EU
# region is open work). The primary serves every call; the fallback gets the
# same request once when the primary fails (5xx, timeout, dropped
# connection), never on a 4xx about the request. The *_NAME picks each one's
# model ids from .com's catalog (packages/control-plane/src/inferenceModels.ts).
UPSTREAM_NAME = "deepinfra"
UPSTREAM_CHAT_URL = "https://api.deepinfra.com/v1/openai/chat/completions"
FALLBACK_NAME = "openrouter"
FALLBACK_CHAT_URL = "https://openrouter.ai/api/v1/chat/completions"
# Only for an upstream the catalog has no ids for (our own vLLM later):
# UPSTREAM_MODEL = "..."
# FALLBACK_MODEL = "..."
# "per-pass" for our own vLLM (see ../upcloud/README.md): salts its shared
# prefix cache per pass. Leave unset for a hosted API.
# UPSTREAM_CACHE_SALT = "per-pass"
# FALLBACK_CACHE_SALT = "per-pass"
# Give up on an upstream that hasn't answered (headers) in this long.
UPSTREAM_TIMEOUT_MS = "60000"
# Ceiling on output tokens per call.
MAX_OUTPUT_TOKENS = "8192"
# "1" pauses free AI for everyone (calls get "isn't available right now").
PAUSED = "0"
COM_BASE_URL = "https://flagshipserver.com"

# Secrets (set with `wrangler secret put`, NOT here):
#   FLAGSHIP_INFERENCE_TOKEN_SECRET  — SAME value as apps/com's secret.
#   UPSTREAM_API_KEY                 — the primary's API key (DeepInfra).
#   FALLBACK_API_KEY                 — the fallback's API key (OpenRouter;
#                                      turn on zero data retention in its
#                                      privacy settings and give the key a
#                                      credit limit).
#   UPSTREAM_ACCESS_CLIENT_ID / UPSTREAM_ACCESS_CLIENT_SECRET (or FALLBACK_…)
#                                    — Cloudflare Access service token, when that
#                                      upstream is our own vLLM behind a tunnel.

# flagship.services on Fly — pure data plane (stateless pipe).
#
# After the .com / .services split, .com (Worker + D1) holds all
# persistent state. This Fly app does only:
#   - Raw-TCP SNI passthrough on :443 → routes browser TLS by SNI to
#     the user's daemon over the tunnel WebSocket.
#   - Tunnel-hub WS at :8443/tunnel — user daemons dial outbound and
#     hold the connection. Multiplexed: one WS carries N TCP streams.
#   - Peer-backup matchmaker (signaling only; no data flows here).
#
# Persistent state: NONE. Restart this app and clients reconnect.

app = "flagship-services"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  TUNNEL_TCP_PORT = "8443"
  FLAGSHIP_SURFACE = "services"

# External :443 → internal :8443 (raw TCP). The SNI router peeks the
# ClientHello, looks up which daemon's tunnel WS owns the SNI, and
# splices the TCP stream over the WS. TLS terminates on the user's
# daemon; we never see plaintext.
[[services]]
  protocol = "tcp"
  internal_port = 8443
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 443
    handlers = []

# External :8443 → internal :3000 (TLS-terminated by Fly with the
# auto-issued cert for flagship-services.fly.dev). Hosts the tunnel-hub
# WS endpoint at /tunnel + the residual /api/health used by Fly's own
# health check.
[[services]]
  protocol = "tcp"
  internal_port = 3000
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 8443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

<!doctype html>
<!-- Store template: the Google Play feature graphic, 1024 x 500. Play crops and overlays it, so the words stay
     inside the middle 70 %; only the phone may come close to an edge. Left: the mark and the word Flagship over a
     two-part headline (voi.ci calls, your own cloud). Right: the phone ringing with a voi.ci call (that language's
     Android capture, slide 01), cropped by the bottom edge, on the teal sun. docs/store-assets/store-assets-brief.md §7. -->
<html lang="en"><head><meta charset="utf-8"><title>Flagship store art: feature graphic</title>
<link rel="stylesheet" href="store.css">
<style>
  .wordmark { display: flex; align-items: center; gap: calc(var(--H) * 0.022px); font-family: "Geist Mono", monospace; font-weight: 500; text-transform: uppercase; letter-spacing: 0.22em; color: var(--muted); font-size: calc(var(--H) * 0.034px); margin-bottom: calc(var(--H) * 0.035px); }
  .wordmark .mark { position: relative; width: calc(var(--H) * 0.07px); height: calc(var(--H) * 0.07px); flex: none; }
  body .feature-text .caption { margin-top: 0; text-wrap: balance; }
  :root[lang="ja"] body .feature-text .caption, :root[lang="zh-Hans"] body .feature-text .caption { text-wrap: wrap; }
</style></head>
<body class="dark">
<script src="slide.js"></script>
<script>
window.layout = (spec, k) => {
  const W = spec.w, H = spec.h, b = document.body;
  // the phone: a third of the width, its top half showing, standing on the sun at the right
  const PW = W * 0.27;
  const sunD = H * 0.9;
  k.el("div", "sun", b, { width: k.px(sunD), height: k.px(sunD), left: k.px(W * 0.8 - sunD / 2), top: k.px(H * 0.6 - sunD / 2) });
  if (spec.capture) {
    const dev = k.deviceBox({ ...spec, device: "android-phone", tone: "dark" }, b, PW);
    Object.assign(dev.box.style, { position: "absolute", left: k.px(W * 0.8 - PW / 2), top: k.px(H * 0.1), zIndex: 2 });
  }
  const t = k.el("div", "feature-text", b, { position: "absolute", left: k.px(W * 0.1), right: k.px(W * 0.45), top: k.px(H * 0.46), transform: "translateY(-50%)", zIndex: 3 });
  const wm = k.el("div", "wordmark", t);
  const m = k.el("div", "mark", wm);
  for (const c of ["frame", "ring", "core"]) k.el("div", c, m);
  k.el("span", "", wm).textContent = "Flagship";
  // the two parts on their own lines (a translation that breaks itself with \n keeps its own breaks)
  const cap = k.el("div", "caption", t);
  const parts = spec.caption.includes("\n") ? [spec.caption] : spec.caption.split(/(?<=[.。])\s+(?=\S)/);
  for (const p of parts) k.el("span", "part", cap, { display: "block" }).textContent = p;
  k.el("div", "shelf", b, { top: k.px(H * 0.9), zIndex: 1 });
};
</script>
</body></html>

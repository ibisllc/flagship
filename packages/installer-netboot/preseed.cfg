# Flagship netboot preseed for Debian 12 (Bookworm) — W12.
#
# This file is the FULL automation script d-i reads at boot. Every
# question d-i would otherwise ask interactively is answered here. The
# install runs unattended end to end (priority=critical on the kernel
# cmdline suppresses every prompt that isn't answered above), and the
# preseed/late_command hook hands control to /flagship/late-command.sh
# inside the chrooted /target before the reboot.
#
# Reference: https://www.debian.org/releases/bookworm/example-preseed.txt
#
# Why d-i:
#   The Alpine 3.21 standard ISO under apkovl-mode does NOT mount its
#   modloop-lts squashfs on a Hetzner cx23 cloud VM. /lib/modules is
#   empty; af_packet can't load; udhcpc fails on
#     socket(AF_PACKET,2,8): Address family not supported by protocol
#   so DHCP never sends Discover, and the bootstrap has no network to
#   apk-add deps from. d-i's installer kernel has every common driver
#   built IN (not modular) — virtio_net, realtek, intel, af_packet all
#   live in the vmlinuz, not in a separately-mounted squashfs. DHCP
#   works on every common cloud VM out of the box.

# ── Locale + keyboard ─────────────────────────────────────────────
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# ── Network ───────────────────────────────────────────────────────
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string flagship-server
d-i netcfg/get_domain string flagship.services
d-i netcfg/wireless_wep string

# Bookworm prompts for non-free firmware confirmation on cloud VMs that
# have a tainted virtio device tree. Suppress the prompt explicitly.
d-i hw-detect/load_firmware boolean true

# ── Mirror ────────────────────────────────────────────────────────
# Use deb.debian.org (geo-load-balanced); same mirror that the Bookworm
# installer ships as default.
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# ── Apt ───────────────────────────────────────────────────────────
# Enable non-free-firmware. Some Hetzner kernels need realtek/intel
# firmware blobs that live there. contrib + non-free stay off (we ship
# nothing depending on them).
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/non-free boolean false
d-i apt-setup/contrib boolean false
d-i apt-setup/services-select multiselect security, updates

# ── Clock + timezone ──────────────────────────────────────────────
d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean true

# ── User accounts ────────────────────────────────────────────────
# No root SSH. Create a 'flagship' user the daemon will run under. The
# placeholder password is replaced by the late-command (the daemon
# doesn't need login; SSH access is key-only). The crypt format below
# is what `mkpasswd -m sha-512` emits for "flagship-firstboot-placeholder";
# the late-command rotates it to a random value before the first real
# boot.
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Flagship Daemon
d-i passwd/username string flagship
d-i passwd/user-password-crypted password $6$saltsaltsaltsaltsalt$Fz2j0/yjeyqQsRGfQ2DGRrXyMz9.6CljgPwQ3UlqOPLqo4kVZk.zhztOQS9rdshOMu7w5WL9.bjvKR7vCs71y0
d-i passwd/user-default-groups string adm dialout cdrom audio video plugdev games users

# ── Partitioning — encrypted LVM ────────────────────────────────
# Encrypted LVM on the entire disk. The daemon's root is LUKS-encrypted;
# the boot partition stays unencrypted (carries our trailer copy +
# boot-stage code that fetches the unlock-key from .com on every boot).
# partman-crypto's install-time passphrase is a placeholder; the
# late-command rotates the LUKS key to one derived from the install
# blob + the phone-delegated pubkey, then luksRemoveKey's the placeholder.
d-i partman-auto/method string crypto
d-i partman-auto-lvm/guided_size string max
d-i partman-auto/choose_recipe select atomic
d-i partman-auto-crypto/erase_disks boolean false
d-i partman-crypto/passphrase string flagship-firstboot-placeholder
d-i partman-crypto/passphrase-again string flagship-firstboot-placeholder
d-i partman-auto/disk string /dev/sda /dev/vda /dev/nvme0n1
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# ── Tasksel ───────────────────────────────────────────────────────
# Minimal install. NO desktop, NO ssh-server (we install + configure
# our own openssh from /flagship/late-command.sh so we control the
# key-only AuthorizedKeysFile + AllowUsers).
tasksel tasksel/first multiselect standard

# Packages we always need. apt-get install runs during d-i's pkgsel
# stage before late-command.
d-i pkgsel/include string openssh-server git curl jq nodejs npm cryptsetup lvm2 ca-certificates xxd
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

# ── GRUB ──────────────────────────────────────────────────────────
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string /dev/sda

# ── Final ─────────────────────────────────────────────────────────
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean false

# ── Late command ─────────────────────────────────────────────────
# Runs after the install but BEFORE reboot. /target is the installed
# Debian rootfs (the encrypted LVM is mounted there). We copy our
# scripts in and exec the late-command via in-target so it runs in the
# chroot with /dev/sda + the encrypted volume both available.
d-i preseed/late_command string \
  cp /cdrom/flagship/install.sh /target/root/flagship-install.sh; \
  cp /cdrom/flagship/parse-trailer.sh /target/root/parse-trailer.sh; \
  cp /cdrom/flagship/late-command.sh /target/root/late-command.sh; \
  chmod +x /target/root/flagship-install.sh /target/root/parse-trailer.sh /target/root/late-command.sh; \
  in-target /root/late-command.sh > /target/var/log/flagship-late-command.log 2>&1 || true

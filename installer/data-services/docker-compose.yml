# Flagship unified data-layer compose.
#
# Brought up on every boot by `installer/data-services/init.sh` (unit
# flagship-data-services.service) — that script generates random root credentials into /var/flagship/data-services.env
# (mode 0600) before this compose file ever sees them.
#
# Architectural rules:
#   - Postgres binds to **127.0.0.1 only**. Never publicly exposed. Its
#     clients are the daemon (admin) and app containers, which reach it
#     through the egress gateway's 5432 forward with the per-app role
#     `DataProvisioner` mints; those credentials never reach the public network.
#   - Persistent volumes live under /var/flagship/data/<service>/ so they
#     sit inside the LUKS-encrypted root. Apps' files are per-app Docker
#     named volumes (`flagship-files-*`), not part of this file.
#   - Postgres is the only store apps get: no object store, no key-value
#     store, no admin web UIs.
#
# Bring up:    docker compose -f /opt/flagship/installer/data-services/docker-compose.yml --env-file /var/flagship/data-services.env up -d
# Stop:        docker compose ... down
# Healthcheck: docker compose ... ps        # all healthy = data layer ready

services:
  postgres:
    # pgvector's Postgres 18 build (Debian trixie): Postgres plus `vector`
    # next to the contrib modules every app database gets. Pinned by tag AND
    # digest (amd64 + arm64); volumeDump.ts's FILES_HELPER_IMAGE is the same
    # image (a test pins them together).
    image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:9d9c930220cb9bf2f956d10a8f909cf9973d9672ca0278aef2c1e6facccad2e0
    container_name: flagship-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      # The 18+ images keep PGDATA at /var/lib/postgresql/18/docker, so the
      # mount is the parent directory (a major upgrade can sit beside it).
      - /var/flagship/data/postgres:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Chromium: pod-resident browser used by the app-platform's browser
  # API (apps drive web automation against the user's logged-in
  # sessions; cookies stay in the container). Headful with Xvfb so
  # fingerprinting checks like `navigator.webdriver` and
  # `HeadlessChrome` user-agent return less suspect values.
  #
  # CDP is exposed on 127.0.0.1:9222 — only the daemon (running as a
  # host process) is the legitimate client. Apps reach the browser
  # ONLY via the daemon's filtered HTTP surface; they never touch
  # CDP directly.
  #
  # Profile (cookies + localStorage + cached logins) is bind-mounted
  # under /var/flagship/data/chromium/profile so it survives container
  # rebuilds and benefits from LUKS-at-rest.
  chromium:
    build:
      context: ./chromium
    container_name: flagship-chromium
    restart: unless-stopped
    volumes:
      - /var/flagship/data/chromium/profile:/home/flagship/profile
    ports:
      - "127.0.0.1:9222:9222"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9222/json/version || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 60

  # Forgejo: per-server git host. Each app's repo lives here. The
  # daemon's update-pack mechanism (future feature; see
  # `memory/future_app_update_pack.md`) reads/writes via Forgejo's HTTP
  # API. SSH is disabled — git traffic is HTTP+token only, all over
  # loopback.
  #
  # Storage: SQLite under /data; one volume holds both the SQLite DB
  # and the on-disk repos. Bound to 127.0.0.1:3030 only.
  forgejo:
    image: codeberg.org/forgejo/forgejo:9-rootless
    container_name: flagship-forgejo
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__database__PATH: /var/lib/gitea/data/forgejo.db
      FORGEJO__server__DOMAIN: 127.0.0.1
      FORGEJO__server__HTTP_ADDR: 0.0.0.0
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__ROOT_URL: http://127.0.0.1:3030
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REGISTER_EMAIL_CONFIRM: "false"
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__log__MODE: console
    volumes:
      - /var/flagship/data/forgejo:/var/lib/gitea
    ports:
      - "127.0.0.1:3030:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 60

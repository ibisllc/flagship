# The app browser's Chromium (SEC-BROWSER-002). Not part of the data layer: init.sh adds this file to the
# stack exactly when the release the box runs turns the browser on (release/box-release.json `appBrowser`,
# the value APP_BROWSER.enabled in packages/server-daemon/src/index.ts reads), and leaves it out otherwise,
# so `up --remove-orphans` removes a Chromium left from before.
#
# Chromium sits alone on the internal `flagship-browser` network: it has no route out. Every request goes
# to the daemon's pinning proxies on that network's gateway (packages/server-daemon/src/browser/egress.ts):
# each app's browser context has its own proxy, fed only with the addresses the policy judge approved for
# that app, and the default proxy below approves nothing. Chromium resolves no names itself. No port is
# published (an internal network has none); the daemon reaches CDP at http://172.31.250.2:9222. Its profile
# is a tmpfs: app contexts never touch it, and nothing survives a restart.
# The addresses and the deny port are pinned with BROWSER_EGRESS in index.ts, and the flags with
# chromiumEgressFlags (a test keeps them in step).
services:
  chromium:
    build: ./chromium
    container_name: flagship-chromium
    restart: unless-stopped
    networks:
      flagship-browser:
        ipv4_address: 172.31.250.2
    tmpfs:
      # Podman refuses uid= on a tmpfs: the profile is writable by the browser's user (uid 1000) through the mode instead.
      # Only this container mounts it, and Chromium keeps its own files 0700 inside.
      - /home/flagship/profile:size=512m,mode=1777
    command:
      - --proxy-server=http://172.31.250.1:18480
      - --proxy-bypass-list=<-loopback>
      - --host-resolver-rules=MAP * ~NOTFOUND, EXCLUDE 172.31.250.1
      - --disable-features=DnsOverHttps,NetworkPrediction
      - --dns-prefetch-disable
      - --disable-quic
      - --force-webrtc-ip-handling-policy=disable_non_proxied_udp
      - --no-pings

networks:
  flagship-browser:
    name: flagship-browser
    internal: true
    ipam:
      config:
        - subnet: 172.31.250.0/24
          gateway: 172.31.250.1

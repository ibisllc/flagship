name = "flagship-boot"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# boot.flagshipserver.com — the dedicated, cloneable boot worker.
#
# Owns the BOOT operations (auto-unlock lease release + the phone-gated
# approval relay). Holds ONLY ciphertext leases/responses + a single-use
# nonce store. Reaches the owner's phone via the NOTIFY PIPE: an
# authenticated server-to-server call to the identity plane, which is the
# only place push secrets (APNs/FCM/VAPID) live. This is what keeps the
# boot worker cloneable — an enterprise can stand it up against its own
# identity plane with no push credentials of its own.
#
# To clone for your own infra:
#   1. Set IDENTITY_PLANE_URL (below) to your identity plane base URL.
#   2. Set FLAGSHIP_APEX (below) to the apex your boxes live under.
#   3. wrangler secret put NOTIFY_SHARED_SECRET   (matching value set on
#      your identity plane's BOOT_NOTIFY_SECRET).
#   4. Create a D1 database + bind it as DB (below), then apply
#      migrations/0001_boot_tables.sql.
#   5. wrangler deploy, and point boxes/phones at this worker.
#
# Secrets (wrangler secret put — NEVER in this file):
#   NOTIFY_SHARED_SECRET   shared bearer for /api/internal/notify-owner
#
# Public env (this file):
#   IDENTITY_PLANE_URL     base URL of the identity plane (id-cert reads
#                          + notify pipe target)
#   FLAGSHIP_APEX          apex used to derive <user> from a box FQDN

# NO routes on the reference deployment. boot.flagshipserver.com was cut over
# to the flagship-com worker (served from packages/boot-core in-process — see
# docs/boot-worker-consolidation.md) on 2026-06-11; its custom domain was
# detached from this worker so flagship-com can own the hostname. This worker
# is retained ONLY as a cloneable target: an enterprise running its own boot
# worker re-adds a custom-domain route here for THEIR hostname, e.g.
#   routes = [ { pattern = "boot.example.com", custom_domain = true } ]
routes = []

[vars]
IDENTITY_PLANE_URL = "https://flagshipserver.com"
FLAGSHIP_APEX = "flagship.services"

# Service binding to the identity-plane worker. REQUIRED in the reference
# (same-zone) deployment: boot.flagshipserver.com and flagshipserver.com are
# both Workers on the flagshipserver.com zone, and a same-zone Worker→Worker
# call over the PUBLIC hostname is NOT re-dispatched to the target worker — it
# falls through to a Cloudflare error page (HTML), which is exactly what broke
# the #27 directory lookup. The binding invokes flagship-com directly. A
# cloneable deployment whose identity plane is a SEPARATE zone can omit this
# and rely on IDENTITY_PLANE_URL over the global fetch instead.
[[services]]
binding = "IDENTITY_PLANE"
service = "flagship-com"

# Own D1 instance for the box-sealed leases + secret mailbox + nonce
# store. Run `wrangler d1 create flagship-boot` and paste the id here.
[[d1_databases]]
binding = "DB"
database_name = "flagship-boot"
database_id = "fbb6ad08-3d6d-4638-b3a7-ede55807fe3c"

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="pairTitle"></title>
<link rel="stylesheet" href="page.css">
<style> main { max-width: 440px; margin: 40px auto; padding: 0 16px; } </style>
<script type="module" src="pair.js"></script>
</head>
<body>
<main>
  <h1 data-i18n="pairTitle"></h1>
  <p class="muted" data-i18n="pairIntro"></p>
  <section id="perm" class="card hidden">
    <p data-i18n="pairNeedsPermission"></p>
    <button id="grant" data-i18n="pairGrantPermission"></button>
  </section>
  <section id="pairing" class="card hidden">
    <p id="status"></p>
    <div id="qr" class="qr hidden"></div>
    <div id="code" class="code hidden"></div>
    <p id="code-hint" class="muted hidden" data-i18n="pairCodeHint"></p>
    <button id="again" class="hidden" data-i18n="pairAgain"></button>
  </section>
  <p class="muted" data-i18n="pairNeverKeys"></p>
</main>
</body>
</html>

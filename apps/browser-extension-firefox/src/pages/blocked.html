<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="blockedTitle"></title>
<link rel="stylesheet" href="page.css">
<style>
  body { background: var(--bad-bg); }
  main { max-width: 560px; margin: 60px auto; padding: 0 16px; }
  h1 { color: var(--bad); font-size: 22px; }
</style>
<script type="module" src="blocked.js"></script>
</head>
<body>
<main>
  <h1 data-i18n="blockedTitle"></h1>
  <p id="lead"></p>
  <p data-i18n="blockedExplain"></p>
  <section class="card">
    <div class="muted" data-i18n="blockedExpected"></div>
    <div id="expected" class="mono"></div>
    <div class="muted" data-i18n="blockedServed"></div>
    <div id="served" class="mono"></div>
  </section>
  <p data-i18n="blockedAdvice"></p>
  <p id="recheck-result" class="muted"></p>
  <div class="row" style="justify-content:flex-start">
    <button id="back" data-i18n="blockedBack"></button>
    <button id="recheck" class="secondary" data-i18n="blockedRecheck"></button>
  </div>
</main>
</body>
</html>

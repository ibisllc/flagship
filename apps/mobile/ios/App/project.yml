# ─────────────────────────────────────────────────────────────────────────────
# BUILDING THE SIMULATOR APP — read before you run xcodebuild.
#
# Use a DESTINATION, never a global -sdk:
#
#   xcodebuild -project apps/mobile/ios/App/FlagshipApp.xcodeproj \
#     -scheme FlagshipApp \
#     -destination 'generic/platform=iOS Simulator' \
#     CODE_SIGNING_ALLOWED=NO build            # ✅ builds (this is what the gym uses)
#
# Do NOT add `-sdk iphonesimulator`:
#
#   xcodebuild ... -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ...
#                                                     # ❌ fails: "unable to resolve
#                                                     #    module dependency: 'FlagshipCore'"
#
# Why: FlagshipShared (FlagshipCore + FlagshipAPI) is a MULTIPLATFORM local SPM
# package linked by BOTH the iOS targets (Flagship / FlagshipUI / the app) AND
# the watchOS targets (FlagshipWatchApp / FlagshipWatchWidgets, which pin
# SDKROOT=watchos + SUPPORTED_PLATFORMS="watchsimulator watchos" below). Passing
# `-sdk iphonesimulator` forces one SDKROOT across the WHOLE build graph, which
# overrides the watch targets' per-target SDKROOT; Xcode then resolves the shared
# local package for the watch targets' only remaining supported platform
# (watchsimulator) and never builds an iphonesimulator slice — so every iOS
# target that imports FlagshipCore/FlagshipAPI fails to resolve the module.
# With a `-destination` (and no `-sdk`) the per-target SDKROOTs are honored, each
# slice of FlagshipShared is built for the platform that needs it, and the app +
# both watch targets build. This is a build-INVOCATION issue, not a source or
# package-wiring defect — `feat/retail`'s NFC code was never the cause.
# ─────────────────────────────────────────────────────────────────────────────
name: FlagshipApp
options:
  bundleIdPrefix: com.flagshipserver
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

# Project-wide version. CURRENT_PROJECT_VERSION → CFBundleVersion and
# MARKETING_VERSION → CFBundleShortVersionString, inherited by every target so
# the app and its embedded bundles (widgets, watch app, watch widgets) always
# share one identical version pair. The App Store rejects an embedded extension
# whose CFBundleVersion differs from its parent app; because the app generates
# its Info.plist (GENERATE_INFOPLIST_FILE) its version resolved to null without
# these, which is exactly the mismatch the build flagged.
settings:
  base:
    CURRENT_PROJECT_VERSION: "2"
    MARKETING_VERSION: "1.0"

# Explicit shared scheme for the iPhone app, so `xcodegen generate` always
# emits a runnable FlagshipApp scheme (Debug run on device, Release archive).
# Without this XcodeGen generated none and it had to be shared by hand in Xcode
# — which would silently disappear on the next regenerate.
schemes:
  FlagshipApp:
    build:
      targets:
        FlagshipApp: all
        FlagshipAppUITests: [test]
    run:
      config: Debug
    # The UITest action runs the XCUITest target (OnboardingSmokeTests +
    # GymSmokeTests + GymEveryMergeTests). The gym's iOS adapter drives this via
    # `xcodebuild test -scheme FlagshipApp -only-testing:FlagshipAppUITests/...`;
    # without a test action the scheme rejects the test action entirely.
    test:
      config: Debug
      targets:
        - FlagshipAppUITests
    archive:
      config: Release

# Register flagship:// URL scheme so external taps and notification
# payloads can deep-link into specific in-app destinations.
fileGroups:
  - .

packages:
  # iOS-only package — Flagship (Keystore/biometric/Argon2Kit) + FlagshipUI
  # (UIKit/ActivityKit). Platforms: iOS + macOS only.
  FlagshipPkg:
    path: ..
  # Cross-platform package — FlagshipCore + FlagshipAPI (protocol, wire
  # types, ProvisionTimelineLadder). Platforms: iOS + watchOS +
  # macOS. The Watch app + Watch widget link THIS package's FlagshipCore
  # product, never FlagshipPkg (which has no watchOS slice).
  FlagshipShared:
    path: ../../shared

targets:
  FlagshipApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources
      - path: Shared
    dependencies:
      - package: FlagshipPkg
        product: FlagshipUI
      - target: FlagshipWidgets
        embed: true
      # FlagshipWatchApp embed turned ON for TestFlight / App Store
      # archives. Requires the watchOS simulator runtime + the
      # `.watchkitapp` bundle ID's App Group capability ticked in the
      # Apple Developer portal (see docs/owner-e2e-checklist.md §
      # TF3 pre-archive). If the local Mac doesn't have the watchOS
      # platform installed, the iPhone-only scheme `FlagshipApp` will
      # still build for Simulator — Xcode skips missing-platform
      # dependencies during simulator builds — but an Archive will
      # fail until the platform is installed.
      - target: FlagshipWatchApp
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flagshipserver.app
        DEVELOPMENT_TEAM: 8G8RHBU9BN
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Flagship
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # Fixed orientation per product decision: iPhone is portrait-only, iPad
        # is landscape-only. Because neither device offers all four orientations
        # we also declare UIRequiresFullScreen — this matches the intent (no
        # Split View / Stage Manager multitasking) and silences Xcode's "all
        # interface orientations must be supported unless the app requires full
        # screen" warning for an iPad-capable target.
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "Flagship uses the camera to scan a pairing QR shown by your server."
        # Biometric gate for sensitive actions (approve unlock, revoke
        # server, wipe & restart). Without this key iOS still falls back
        # to passcode, but the prompt looks stock — TF3 ASC review-bot
        # flags absence.
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Flagship uses Face ID to confirm sensitive actions like approving unlock or revoking a server."
        # ASC review-bot wants a category for every app. Flagship is a
        # tool / utility, not entertainment or social.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        # Export-compliance: we only use OS-provided crypto (CryptoKit,
        # Security.framework) + standard HTTPS/TLS, so declare NO to
        # skip the per-Archive manual prompt that delays TestFlight by
        # ~24h.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # ActivityKit Live Activities for the create-server SSE flow.
        # Renders on Dynamic-Island + Lock-Screen via the widget extension.
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        # Sign on every build. On-device debug builds — AND the embedded
        # widget + watch targets — MUST be signed or the install fails with
        # "executable is not codesigned" / embedded-binary cert mismatch.
        # Simulator builds just ad-hoc "Sign to Run Locally" (no cert needed),
        # so YES is safe for CI/simulator too. (Was NO; that broke device runs.)
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    info:
      path: Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.flagshipserver.app.deeplink
            CFBundleURLSchemes: [flagship]
        UIBackgroundModes: [remote-notification, fetch]
    entitlements:
      path: FlagshipApp.entitlements
      properties:
        # Xcode's "Process Entitlements" build phase expands $() refs
        # to build settings — so Debug → development, Release →
        # production. Required for App Store / TestFlight (the
        # production APNs gateway only accepts production-environment
        # device tokens).
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.associated-domains:
          - applinks:flagshipserver.com
          - webcredentials:flagshipserver.com
        # App Group lets the widget extension read pod status without
        # round-tripping through the main app. The group ID must
        # match PodStatusSnapshot.appGroupId.
        com.apple.security.application-groups:
          - group.com.flagshipserver.app
        # Critical Alerts entitlement — APNs payloads with the
        # critical sound flag bypass Focus/DND. Apple grants this
        # via a separate request (User Guide:
        # https://developer.apple.com/contact/request/notifications-critical-alerts-entitlement/).
        # DISABLED until Apple grants it: an UNGRANTED special entitlement
        # blocks automatic-signing profile creation for development device
        # builds (it is NOT silently ignored on the dev path — contrary to a
        # prior note here). The app doesn't request `.criticalAlert` yet, so
        # nothing functional is lost. Re-enable this single line the moment the
        # grant lands (then `xcodegen generate`), and wire the client
        # `.criticalAlert` authorization + critical-flagged APNs payloads.
        # com.apple.developer.usernotifications.critical-alerts: true

  FlagshipWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WidgetExtension
        excludes:
          - "Info.plist"
          - "FlagshipWidgets.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flagshipserver.app.widgets
        DEVELOPMENT_TEAM: 8G8RHBU9BN
        INFOPLIST_FILE: WidgetExtension/Info.plist
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES
        SKIP_INSTALL: YES
    entitlements:
      path: WidgetExtension/FlagshipWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.flagshipserver.app

  FlagshipWatchApp:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchApp
        excludes:
          - "Info.plist"
      # Compile the shared AppIcon catalog for watchOS too. The catalog carries
      # a watchOS 1024x1024 slot, from which Xcode generates every Watch icon
      # variant and the CFBundleIcons metadata required by App Store Connect.
      - path: Resources/Assets.xcassets
    dependencies:
      # The wire types the watch decodes (WatchProtocol.*) +
      # cross-platform protocol code (ProvisionTimelineLadder,
      # etc.) live in the FlagshipShared package's FlagshipCore product.
      # The watch links ONLY the cross-platform package — never `Flagship`
      # (Keystore/biometric) or `FlagshipUI` (UIKit/ActivityKit), and
      # never FlagshipPkg (no watchOS slice → would fail to resolve).
      - package: FlagshipShared
        product: FlagshipCore
      # W2 — embedded widget extension that renders the install-
      # progress complication on the watch face / Smart Stack.
      - target: FlagshipWatchWidgets
        embed: true
    entitlements:
      path: WatchApp/FlagshipWatchApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.flagshipserver.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flagshipserver.app.watchkitapp
        DEVELOPMENT_TEAM: 8G8RHBU9BN
        INFOPLIST_FILE: WatchApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: WatchApp/FlagshipWatchApp.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: "watchsimulator watchos"

  # W2 — Watch widget extension that ships the install-progress
  # complication. Lives inside the FlagshipWatchApp.app bundle's
  # PlugIns/ directory via the embed dependency above.
  FlagshipWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchWidgets
        excludes:
          - "Info.plist"
    dependencies:
      # Same FlagshipCore product the watch app uses — the widget
      # decodes the App-Group-shared ProvisionTimelineContext blob the
      # watch app deposits there. Cross-platform FlagshipShared product.
      - package: FlagshipShared
        product: FlagshipCore
    entitlements:
      path: WatchWidgets/FlagshipWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.flagshipserver.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flagshipserver.app.watchkitapp.widgets
        DEVELOPMENT_TEAM: 8G8RHBU9BN
        INFOPLIST_FILE: WatchWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: WatchWidgets/FlagshipWatchWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: "watchsimulator watchos"
        SKIP_INSTALL: YES

  FlagshipAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: FlagshipApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flagshipserver.app.UITests
        DEVELOPMENT_TEAM: 8G8RHBU9BN
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FlagshipApp
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES
        SWIFT_VERSION: "5.0"

name: FlagshipApp
options:
  bundleIdPrefix: com.flagship
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

# Register flagship:// URL scheme so external taps and notification
# payloads can deep-link into specific in-app destinations.
fileGroups:
  - .

packages:
  FlagshipPkg:
    path: ..

targets:
  FlagshipApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: FlagshipPkg
        product: FlagshipUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flagship.FlagshipApp
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Flagship
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Flagship uses the camera to scan a pairing QR shown by your server."
    info:
      path: Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.flagship.deeplink
            CFBundleURLSchemes: [flagship]
        UIBackgroundModes: [remote-notification]
    entitlements:
      path: FlagshipApp.entitlements
      properties:
        aps-environment: development
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

  FlagshipAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: FlagshipApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flagship.FlagshipApp.UITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FlagshipApp
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        SWIFT_VERSION: "5.0"

name: FlagshipApp
options:
  bundleIdPrefix: com.flagshipserver
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

# Register flagship:// URL scheme so external taps and notification
# payloads can deep-link into specific in-app destinations.
fileGroups:
  - .

packages:
  # iOS-only package — Flagship (Keystore/biometric/Argon2Kit) + FlagshipUI
  # (UIKit/ActivityKit). Platforms: iOS + macOS only.
  FlagshipPkg:
    path: ..
  # Cross-platform package — FlagshipCore + FlagshipAPI (protocol, wire
  # types, NfcPair, ProvisionTimelineLadder). Platforms: iOS + watchOS +
  # macOS. The Watch app + Watch widget link THIS package's FlagshipCore
  # product, never FlagshipPkg (which has no watchOS slice).
  FlagshipShared:
    path: ../../shared

targets:
  FlagshipApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources
      - path: Shared
    dependencies:
      - package: FlagshipPkg
        product: FlagshipUI
      - target: FlagshipWidgets
        embed: true
      # FlagshipWatchApp embed turned ON for TestFlight / App Store
      # archives. Requires the watchOS simulator runtime + the
      # `.watchkitapp` bundle ID's App Group capability ticked in the
      # Apple Developer portal (see docs/owner-e2e-checklist.md §
      # TF3 pre-archive). If the local Mac doesn't have the watchOS
      # platform installed, the iPhone-only scheme `FlagshipApp` will
      # still build for Simulator — Xcode skips missing-platform
      # dependencies during simulator builds — but an Archive will
      # fail until the platform is installed.
      - target: FlagshipWatchApp
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flagshipserver.app
        DEVELOPMENT_TEAM: 8G8RHBU9BN
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Flagship
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Flagship uses the camera to scan a pairing QR shown by your server."
        # Biometric gate for sensitive actions (approve unlock, revoke
        # server, wipe & restart). Without this key iOS still falls back
        # to passcode, but the prompt looks stock — TF3 ASC review-bot
        # flags absence.
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Flagship uses Face ID to confirm sensitive actions like approving unlock or revoking a server."
        # NFC retail-tier pairing (N-PHONE / C3). The phone reads a
        # PAIR + SIG NDEF from a branded box's tag, derives a session
        # key via ECDH, and seals the Wi-Fi config under it. Required
        # whenever the binary links Core NFC.
        INFOPLIST_KEY_NFCReaderUsageDescription: "Flagship uses NFC to pair a new Flagship box by tapping your phone to it."
        # ASC review-bot wants a category for every app. Flagship is a
        # tool / utility, not entertainment or social.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        # Export-compliance: we only use OS-provided crypto (CryptoKit,
        # Security.framework) + standard HTTPS/TLS, so declare NO to
        # skip the per-Archive manual prompt that delays TestFlight by
        # ~24h.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # ActivityKit Live Activities for the create-server SSE flow.
        # Renders on Dynamic-Island + Lock-Screen via the widget extension.
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        # CODE_SIGNING_ALLOWED stays NO for simulator-only builds;
        # device + TestFlight archives flip these via xcconfig or
        # `xcodebuild -allowProvisioningUpdates` at archive time.
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    info:
      path: Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.flagshipserver.app.deeplink
            CFBundleURLSchemes: [flagship]
        UIBackgroundModes: [remote-notification, fetch]
    entitlements:
      path: FlagshipApp.entitlements
      properties:
        # Xcode's "Process Entitlements" build phase expands $() refs
        # to build settings — so Debug → development, Release →
        # production. Required for App Store / TestFlight (the
        # production APNs gateway only accepts production-environment
        # device tokens).
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.associated-domains:
          - applinks:flagshipserver.com
          - webcredentials:flagshipserver.com
        # App Group lets the widget extension read pod status without
        # round-tripping through the main app. The group ID must
        # match PodStatusSnapshot.appGroupId.
        com.apple.security.application-groups:
          - group.com.flagshipserver.app
        # Critical Alerts entitlement — APNs payloads with the
        # critical sound flag bypass Focus/DND. Apple grants this
        # via a separate request (User Guide:
        # https://developer.apple.com/contact/request/notifications-critical-alerts-entitlement/).
        # Shipping the entitlement on the binary BEFORE Apple grants
        # is harmless (it'll just be ignored), so we declare it now
        # to avoid a TestFlight re-upload when the grant lands.
        com.apple.developer.usernotifications.critical-alerts: true
        # NFC retail-tier pairing (C3 / N-PHONE). NDEF + TAG let us
        # both read the branded box's PAIR+SIG NDEF and (for diagnostic
        # workflows) talk to ISO14443 tags directly. The dev portal
        # also needs Near Field Communication Tag Reading enabled on
        # com.flagshipserver.app before the Archive will validate.
        com.apple.developer.nfc.readersession.formats:
          - NDEF
          - TAG

  FlagshipWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WidgetExtension
        excludes:
          - "Info.plist"
          - "FlagshipWidgets.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flagshipserver.app.widgets
        DEVELOPMENT_TEAM: 8G8RHBU9BN
        INFOPLIST_FILE: WidgetExtension/Info.plist
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        SKIP_INSTALL: YES
    entitlements:
      path: WidgetExtension/FlagshipWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.flagshipserver.app

  FlagshipWatchApp:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchApp
        excludes:
          - "Info.plist"
    dependencies:
      # The wire types the watch decodes (WatchProtocol.*) +
      # cross-platform protocol code (NfcPair, ProvisionTimelineLadder,
      # etc.) live in the FlagshipShared package's FlagshipCore product.
      # The watch links ONLY the cross-platform package — never `Flagship`
      # (Keystore/biometric) or `FlagshipUI` (UIKit/ActivityKit), and
      # never FlagshipPkg (no watchOS slice → would fail to resolve).
      - package: FlagshipShared
        product: FlagshipCore
      # W2 — embedded widget extension that renders the install-
      # progress complication on the watch face / Smart Stack.
      - target: FlagshipWatchWidgets
        embed: true
    entitlements:
      path: WatchApp/FlagshipWatchApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.flagshipserver.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flagshipserver.app.watchkitapp
        DEVELOPMENT_TEAM: 8G8RHBU9BN
        INFOPLIST_FILE: WatchApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: WatchApp/FlagshipWatchApp.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: "watchsimulator watchos"

  # W2 — Watch widget extension that ships the install-progress
  # complication. Lives inside the FlagshipWatchApp.app bundle's
  # PlugIns/ directory via the embed dependency above.
  FlagshipWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchWidgets
        excludes:
          - "Info.plist"
    dependencies:
      # Same FlagshipCore product the watch app uses — the widget
      # decodes the App-Group-shared ProvisionTimelineContext blob the
      # watch app deposits there. Cross-platform FlagshipShared product.
      - package: FlagshipShared
        product: FlagshipCore
    entitlements:
      path: WatchWidgets/FlagshipWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.flagshipserver.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flagshipserver.app.watchkitapp.widgets
        DEVELOPMENT_TEAM: 8G8RHBU9BN
        INFOPLIST_FILE: WatchWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: WatchWidgets/FlagshipWatchWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: "watchsimulator watchos"
        SKIP_INSTALL: YES

  FlagshipAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: FlagshipApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flagshipserver.app.UITests
        DEVELOPMENT_TEAM: 8G8RHBU9BN
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FlagshipApp
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        SWIFT_VERSION: "5.0"

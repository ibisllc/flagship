name: FlagshipApp
options:
  bundleIdPrefix: com.flagshipserver
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

# Register flagship:// URL scheme so external taps and notification
# payloads can deep-link into specific in-app destinations.
fileGroups:
  - .

packages:
  FlagshipPkg:
    path: ..

targets:
  FlagshipApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources
      - path: Shared
    dependencies:
      - package: FlagshipPkg
        product: FlagshipUI
      - target: FlagshipWidgets
        embed: true
      # NOTE: FlagshipWatchApp is intentionally NOT listed as an
      # embedded dependency here so the iPhone scheme builds clean on
      # a host without a watchOS simulator runtime. For TestFlight /
      # App Store archives the watch app needs to be embedded — flip
      # this back on (or wire via a separate archive xcconfig) once
      # the user has installed a watchOS simulator + the watch
      # bundle-id is registered in the Apple Developer portal.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flagshipserver.app
        DEVELOPMENT_TEAM: 8G8RHBU9BN
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Flagship
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Flagship uses the camera to scan a pairing QR shown by your server."
        # ActivityKit Live Activities for the create-server SSE flow.
        # Renders on Dynamic-Island + Lock-Screen via the widget extension.
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        # CODE_SIGNING_ALLOWED stays NO for simulator-only builds;
        # device + TestFlight archives flip these via xcconfig or
        # `xcodebuild -allowProvisioningUpdates` at archive time.
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    info:
      path: Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.flagshipserver.app.deeplink
            CFBundleURLSchemes: [flagship]
        UIBackgroundModes: [remote-notification, fetch]
    entitlements:
      path: FlagshipApp.entitlements
      properties:
        # Xcode's "Process Entitlements" build phase expands $() refs
        # to build settings — so Debug → development, Release →
        # production. Required for App Store / TestFlight (the
        # production APNs gateway only accepts production-environment
        # device tokens).
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.associated-domains:
          - applinks:flagshipserver.com
          - webcredentials:flagshipserver.com
        # App Group lets the widget extension read pod status without
        # round-tripping through the main app. The group ID must
        # match PodStatusSnapshot.appGroupId.
        com.apple.security.application-groups:
          - group.com.flagshipserver.app
        # Critical Alerts entitlement — APNs payloads with the
        # critical sound flag bypass Focus/DND. Apple grants this
        # via a separate request (User Guide:
        # https://developer.apple.com/contact/request/notifications-critical-alerts-entitlement/).
        # Shipping the entitlement on the binary BEFORE Apple grants
        # is harmless (it'll just be ignored), so we declare it now
        # to avoid a TestFlight re-upload when the grant lands.
        com.apple.developer.usernotifications.critical-alerts: true

  FlagshipWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WidgetExtension
        excludes:
          - "Info.plist"
          - "FlagshipWidgets.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flagshipserver.app.widgets
        DEVELOPMENT_TEAM: 8G8RHBU9BN
        INFOPLIST_FILE: WidgetExtension/Info.plist
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        SKIP_INSTALL: YES
    entitlements:
      path: WidgetExtension/FlagshipWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.flagshipserver.app

  FlagshipWatchApp:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchApp
        excludes:
          - "Info.plist"
      - path: Shared/WatchApproval.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flagshipserver.app.watchkitapp
        DEVELOPMENT_TEAM: 8G8RHBU9BN
        INFOPLIST_FILE: WatchApp/Info.plist
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: "watchsimulator watchos"

  FlagshipAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: FlagshipApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flagshipserver.app.UITests
        DEVELOPMENT_TEAM: 8G8RHBU9BN
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FlagshipApp
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        SWIFT_VERSION: "5.0"

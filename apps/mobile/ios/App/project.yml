name: FlagshipApp
options:
  bundleIdPrefix: com.flagshipserver
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

# Register flagship:// URL scheme so external taps and notification
# payloads can deep-link into specific in-app destinations.
fileGroups:
  - .

packages:
  FlagshipPkg:
    path: ..

targets:
  FlagshipApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: FlagshipPkg
        product: FlagshipUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flagshipserver.app
        DEVELOPMENT_TEAM: 8G8RHBU9BN
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Flagship
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Flagship uses the camera to scan a pairing QR shown by your server."
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        # CODE_SIGNING_ALLOWED stays NO for simulator-only builds;
        # device + TestFlight archives flip these via xcconfig or
        # `xcodebuild -allowProvisioningUpdates` at archive time.
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    info:
      path: Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.flagshipserver.app.deeplink
            CFBundleURLSchemes: [flagship]
        UIBackgroundModes: [remote-notification]
    entitlements:
      path: FlagshipApp.entitlements
      properties:
        # Xcode's "Process Entitlements" build phase expands $() refs
        # to build settings — so Debug → development, Release →
        # production. Required for App Store / TestFlight (the
        # production APNs gateway only accepts production-environment
        # device tokens).
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.associated-domains:
          - applinks:flagshipserver.com
          - webcredentials:flagshipserver.com

  FlagshipAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: FlagshipApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flagshipserver.app.UITests
        DEVELOPMENT_TEAM: 8G8RHBU9BN
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FlagshipApp
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        SWIFT_VERSION: "5.0"

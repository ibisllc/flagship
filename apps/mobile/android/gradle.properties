# JVM args sized for AGP + KSP + Compose
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX is required by every dep we pull
android.useAndroidX=true
android.nonTransitiveRClass=true

# R8 full mode (vs. compatibility mode) does whole-program optimization —
# more aggressive inlining/class-merging, lower memory + smaller release
# builds. AGP defaults to it, but Play Console's pre-launch report flagged
# our first upload as compatibility mode, so pin it explicitly.
android.enableR8.fullMode=true

# Kotlin
kotlin.code.style=official

# flagship-com-GYM — the isolated TEST control plane (docs/ui-test-gym.md §6.5,
# §12-G6). This is a SEPARATE Worker from prod (`wrangler.toml`), served at the
# `gym.flagshipserver.com` custom domain, with its OWN D1 / R2 / Durable Object /
# rate-limit namespaces — zero shared state with prod. Isolation is by ZEROING
# (its own DB, wiped between runs), not by secrecy (§4): the `gym.` apex is
# public/knowable and that is fine.
#
# DEPLOY (turnkey runbook): docs/runbooks/gym-test-env.md.
#   cd apps/com && npx wrangler deploy --config wrangler.gym.toml
# (Prod is `npx tsc -b && npx wrangler deploy` against the DEFAULT wrangler.toml,
#  which this file does NOT touch.)
#
# WHY a separate FILE (not `[env.gym]`): wrangler's `[env.<name>]` blocks do NOT
# inherit top-level `[[d1_databases]]` / `[[r2_buckets]]` / `[[durable_objects]]`
# / `[triggers]` — every binding must be redeclared inside the env block anyway,
# and a single misedit there silently mutates the PROD default env. A standalone
# `--config` file keeps prod byte-identical by construction (the prod file is
# never opened on a gym deploy) and keeps the gym surface readable in one place.
#
# Same source, same migrations, same Dockerfile-less Worker bundle as prod — only
# the apex `[vars]` + the resource NAMES differ. The apex-var refactor (§12-G1/G2,
# already on main) is what makes "set the var to gym. + deploy" run the SAME code.

name = "flagship-com-gym"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

# Routes / custom domains under the `gym.` label of the EXISTING zones (no new
# zone — rev4). Custom domains let wrangler self-provision the proxied DNS record
# + edge cert (the boot./recovery. mechanism we already use), so the hostnames
# resolve to flagship-com-gym with no manual DNS step / no dns:write token.
#   - gym.flagshipserver.com — the test control plane apex.
#   - webapp.gym.flagshipserver.com — the test webapp host (Worker host-rewrite).
#   - remote.gym.flagshipserver.com — the test browser-remote host.
#   - recovery.gym. / boot.gym. — the test sub-origins (mirror prod's recovery./boot.).
# These are namespaced under `gym.` so they never shadow a prod record.
routes = [
  { pattern = "gym.flagshipserver.com",          custom_domain = true },
  { pattern = "webapp.gym.flagshipserver.com",    custom_domain = true },
  { pattern = "remote.gym.flagshipserver.com",    custom_domain = true },
  { pattern = "recovery.gym.flagshipserver.com",  custom_domain = true },
  { pattern = "boot.gym.flagshipserver.com",      custom_domain = true },
]

# Static assets — identical to prod (the same ../web/public tree, same SPA
# fallback + run-worker-first host-rewrite). The test webapp served from
# webapp.gym.flagshipserver.com derives its apex from window.location.origin
# (§12-G2) so it "just works" against the gym apex with no per-build edit.
[assets]
directory = "../web/public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/*"]

# --- R2: four test buckets (`-gym` suffix), mirroring prod's four ------------
# Create once (see the runbook): wrangler r2 bucket create flagship-iso-gym, etc.
[[r2_buckets]]
binding = "ISO_BUCKET"
bucket_name = "flagship-iso-gym"

# Re-enable the temp bucket's PUBLIC dev-url for the gym bucket and re-pin
# FLAGSHIP_R2_TEMP_PUBLIC_BASE below (the `pub-…r2.dev` host is PER-BUCKET, so it
# differs from prod's). The cloud-init user_data wgets `${BASE}/${R2_KEY}`.
[[r2_buckets]]
binding = "ISO_TEMP_BUCKET"
bucket_name = "flagship-iso-temp-gym"

[[r2_buckets]]
binding = "BACKUPS_BUCKET"
bucket_name = "flagship-backups-gym"

# Repo adapter queue. No ADAPTERS_REPO here on purpose: the gym must never
# publish to the public index, so its queue only ever fills.
[[r2_buckets]]
binding = "ADAPTERS_BUCKET"
bucket_name = "flagship-adapters-gym"

# Cron triggers — same cadence/handlers as prod (D1→R2 backup + CT scan; the
# demo-user reaper + provisioning poller). The reaper no-ops without HCLOUD_TOKEN,
# so this is safe before the test Hetzner token is wired.
[triggers]
crons = ["0 */6 * * *", "*/10 * * * *"]

# Every rate limit in apps/com/src/rateLimit.ts counts in a RateLimitCounter
# Durable Object (one per endpoint, axis and identifier), so each budget is
# global and exact. Cloudflare's `ratelimit` binding isn't used: one
# (limit, period) per namespace, 10 or 60 s periods only, counted per location.
[[durable_objects.bindings]]
name = "RATE_LIMITS"
class_name = "RateLimitCounter"

# --- D1: the gym's OWN database (wiped between runs) ---------------------------
# PLACEHOLDER database_id — create the real DB once and paste its id here:
#   cd apps/com && npx wrangler d1 create flagship-state-gym
# then apply the SAME migrations dir prod uses (idempotent):
#   npx wrangler d1 migrations apply flagship-state-gym --config wrangler.gym.toml --remote
# Wipe between runs: scripts/wipe-all-users.sh after pointing it at this DB
# (see the runbook's "wipe-between-runs" section).
[[d1_databases]]
binding = "DB"
database_name = "flagship-state-gym"
database_id = "b017db24-3be4-40c7-8690-a91f0964c2ff"
migrations_dir = "../../packages/storage/migrations"

# --- Durable Object: same class, auto-created in THIS Worker (no shared state) -
[[durable_objects.bindings]]
name = "BUILD_RELAY"
class_name = "BuildRelaySession"

[[durable_objects.bindings]]
name = "BUILDER_RELAY"
class_name = "BuilderRelaySession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BuildRelaySession"]

[[migrations]]
tag = "v2"
# Deployed under the original class name; preserved verbatim, renamed in v3.
new_sqlite_classes = ["BurnerRelaySession"]

[[migrations]]
tag = "v3"
# burner→builder class rename (see apps/com/wrangler.toml). Ephemeral DO.
renamed_classes = [{ from = "BurnerRelaySession", to = "BuilderRelaySession" }]

[[migrations]]
tag = "v4"
# The rate-limit counters (apps/com/src/rateLimitCounter.ts).
new_sqlite_classes = ["RateLimitCounter"]

[vars]
# ⭐ THE FLIP (§6.5 / §12-G1): point the apex vars at the `gym.` apex. These are
# the SAME vars prod's wrangler.toml defaults to the literals — here we override
# them so this Worker serves the isolated test env on the SAME zones. SERVICES_APEX
# threads into serverDomain validation, the user-zone CAA anchor, the DNS-01
# own-name fence, and apex cleanup (apps/com/src/controlPlaneRoutes.ts reads
# env.SERVICES_APEX); CONTROL_APEX is the identity apex. Test boxes are
# `<server>.<user>.gym.flagship.services`.
SERVICES_APEX = "gym.flagship.services"
CONTROL_APEX = "gym.flagshipserver.com"

# Worker → Fly wiring: REPOINTED at the gym Fly app (flagship-services-gym) +
# its own anycast IPs. The :443 listener does SNI passthrough; the Worker proxies
# unhandled /api/* to the :8443 TLS-term endpoint.
SERVICES_BASE_URL = "https://flagship-services-gym.fly.dev:8443"

# Peer backup between accounts (docs/peer-backup.md §2): the gym fleet has two
# accounts, all on one cloud's networks, so a backup goes to one holder of the
# other account (prod: 4 of 8, distinct accounts and networks).
PB_NETWORK = '{"k":1,"n":1,"diversity":"account"}'
TUNNEL_HUB_URL = "wss://flagship-services-gym.fly.dev:8443/tunnel"
# Scripted gym runs come from one address; scale the rate limits so a run
# doesn't trip budgets sized for one person (apps/com/src/rateLimit.ts).
RATE_LIMIT_SCALE = "10"
# Anycast IPs of the gym Fly app's SNI passthrough listener. PLACEHOLDERS —
# fill in after `flyctl ips allocate-v4/-v6 -a flagship-services-gym`
# (see the runbook). The Worker writes A/AAAA for each registered
# `<server>.<user>.gym.flagship.services` pointing at these.
SERVICES_PASSTHROUGH_IPV4 = "137.66.62.214"
SERVICES_PASSTHROUGH_IPV6 = "2a09:8280:1::12d:5999:0"

# Base-ISO + manifest vars — REUSE prod's values verbatim (the base OS is the
# same Debian/Alpine; the gym personalizes the same bytes). Only the temp-bucket
# public base differs (per-bucket host). Re-pin on a Debian point release exactly
# as prod does.
BASE_ISO_URL = "https://flagshipserver.com/build/iso/flagship-base-alpine-3.21.0-x86_64-apkovl3-debug3.iso"
BASE_ISO_VERSION = "flagship-alpine-3.21.0-x86_64-apkovl3-debug"
BASE_ISO_SHA256 = "52bbb7432dade2b6a86be483d00edd95df02a34b84bb4d9ca9a8dfddd71cc653"
FLAGSHIP_ISO_MANIFEST = '{"version":"debian-13.6.0","url":"https://cdimage.debian.org/cdimage/archive/13.6.0/amd64/iso-cd/debian-13.6.0-amd64-netinst.iso","sha256":"65273beed27b2df543b68b65630ba525cfbad8df2b12035732b2dff87d6664e7","sizeBytes":791674880,"attestation":"https://cdimage.debian.org/cdimage/archive/13.6.0/amd64/iso-cd/SHA256SUMS"}'
FLAGSHIP_BASE_ISO_KEY = "flagship-base-alpine-3.21.0-x86_64-apkovl3-debug3.iso"
# PLACEHOLDER — the gym temp bucket's public dev-url host (PER-BUCKET, differs
# from prod). After `wrangler r2 bucket dev-url enable flagship-iso-temp-gym`,
# paste the resulting `pub-…r2.dev` host here.
FLAGSHIP_R2_TEMP_PUBLIC_BASE = "https://pub-023a8bc99ad045939af943fd4663ce76.r2.dev"

# Cloudflare zone ID for flagship.services (the SAME zone — the gym lives under
# its `gym.` label, no new zone). Per-box `<server>.<user>.gym.flagship.services`
# A/AAAA + DNS-01 `_acme-challenge.<…>.gym.flagship.services` are published by
# THIS Worker into this zone via the gym's own CLOUDFLARE_DNS_API_TOKEN secret.
CLOUDFLARE_SERVICES_ZONE_ID = "51f3bfe11a729db57effd70ed3cf9c77"

# CA chokepoint ENFORCED, as on prod. The gym branch serves its own
# self-contained chain (gymTrustMaterial.ts: one key K is the gym maintainer
# authority AND this Worker's FLAGSHIP_CA_PRIV_HEX, endorsed by a 100-year
# CaEndorsement), so enforcement passes here without the prod YubiKey lease.
CA_ENDORSEMENT_ENFORCE = "true"

# Gym boxes are created on UpCloud (Hetzner is suspended). The plan is bigger
# than prod demos' STARTER-2xCPU-4GB: a gym box runs the full data platform
# (Postgres 18, gVisor app sandboxes, builds). Every server carries the
# flagship-env=gym label, which is all /api/gym/teardown will ever delete.
DEMO_CLOUD_PROVIDER = "upcloud"
UPCLOUD_ZONE = "de-fra1"
UPCLOUD_PLAN = "STARTER-4xCPU-8GB"
UPCLOUD_TEMPLATE = "01000000-0000-4000-8000-000020070100"
UPCLOUD_STORAGE_GB = "40"
UPCLOUD_EXTRA_LABELS = "flagship-env=gym"

# ── SECRETS — set against THIS Worker before the first gym deploy ─────────────
# (NOT in this file — `wrangler secret put <NAME> --config wrangler.gym.toml`.)
# The gym needs its OWN copies so it never reuses a prod secret (except the
# UpCloud token: one account, and the flagship-env=gym label keeps them apart).
# scripts/gym-refresh.sh reports any secret prod has that the gym lacks.
#   FLAGSHIP_ADMIN_SECRET          gates /api/dev/sample-user/* + the D5 test hooks
#   UPCLOUD_TOKEN                  the UpCloud API token (~/.config/flagship/upcloud-token)
#   FLAGSHIP_CA_PRIV_HEX           the gym key K (gymTrustMaterial.ts on the gym branch)
#   ACCOUNT_READ_TOKEN_SECRET, FLAGSHIP_RECOVERY_PROOF_SECRET, FLAGSHIP_TOTP_KEK,
#   BOOT_NOTIFY_SECRET, FLAGSHIP_INFERENCE_TOKEN_SECRET   fresh random hex
#   SERVICES_CONTROL_SECRET, USAGE_REPORT_SECRET  fresh, and the SAME values on
#                                  the gym Fly app (flyctl secrets set -a flagship-services-gym)
#   DEMO_PUBLIC_SSH_KEY            optional (Hetzner only; HCLOUD_TOKEN is legacy)
#   DEMO_IRK_KEK                   32-byte hex (openssl rand -hex 32) — deterministic demo IRKs
#   SERVICES_HMAC_KEY             Worker↔Fly shared secret (match the gym Fly app's)
#   CLOUDFLARE_DNS_API_TOKEN      Zone:DNS:Edit on flagship.services (for the gym `gym.` records)
#   WEBPUSH_VAPID_PRIVATE_KEY_PEM  test VAPID pair (mint fresh; do NOT reuse prod's)
#   WEBPUSH_VAPID_PUBLIC_KEY_B64URL
#   WEBPUSH_CONTACT
# Optional (only if the gym enforces a test CA): FLAGSHIP_CA_PRIV_HEX.
# APNS_*/FCM_* push: optional — set only if exercising real device push in the gym.

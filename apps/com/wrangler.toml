name = "flagship-com"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# Custom domains: Cloudflare auto-provisions DNS + cert and ALL traffic
# (every path) hits this Worker. The www CNAME chains to the apex so the
# www host shares the same Worker.
workers_dev = true

# Routes for `flagshipserver.com/*` and `www.flagshipserver.com/*` are
# managed out-of-band via the Cloudflare API (POST /zones/{zone}/workers/routes)
# because the apex retains a legacy CNAME → Surge from the old marketing site
# (backed up as `old_flagship_website.zip` at the repo root). Worker Routes
# intercept before origin so the legacy CNAME is harmless.
# To re-add the routes if dropped:
#   curl -X POST .../zones/$ZONE/workers/routes -d '{"pattern":"flagshipserver.com/*","script":"flagship-com"}'
#   curl -X POST .../zones/$ZONE/workers/routes -d '{"pattern":"www.flagshipserver.com/*","script":"flagship-com"}'

# Static assets — marketing pages, /webapp/, /deck/, /security pages,
# /.well-known/security.txt. Wrangler will upload everything in this
# directory to Cloudflare's static edge.
[assets]
directory = "../web/public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Don't let the asset edge intercept paths the Worker owns: every /api/*
# call (control plane, status probe) and every /build/iso/* (R2 stream)
# must hit the Worker first.
run_worker_first = ["/api/*", "/build/iso/*"]

[[r2_buckets]]
binding = "ISO_BUCKET"
bucket_name = "flagship-iso"

[[d1_databases]]
binding = "DB"
database_name = "flagship-state"
database_id = "d6f3bc03-0168-4988-8742-83346fdc923c"
migrations_dir = "../../packages/storage/migrations"

[vars]
# Fly's TLS-term endpoint (port 8443). The flagship.services apex itself
# runs SNI passthrough on :443, so https://flagship.services/api/* will
# always 525. The Worker proxies any /api/* path it doesn't handle to
# this endpoint instead. (For end-to-end requests, clients should use
# `flagshipserver.com` for API and `<server>.<user>.flagship.services`
# for user content.)
SERVICES_BASE_URL = "https://flagship-services.fly.dev:8443"
# `flagship-base-alpine-...` = stock Alpine 3.21 with our apkovl baked at
# the root of the ISO9660 filesystem. The apkovl carries:
#   /etc/local.d/01-flagship-bootstrap.start
#   /usr/local/bin/flagship-trailer-probe
#   /usr/local/bin/flagship-trailer-validate
# On boot, Alpine's overlay-init loads the apkovl, the bootstrap script
# probes the boot media for the trailer, validates the signature, and
# fetches installer/install.sh from GitHub at the trailer-pinned ref.
BASE_ISO_URL = "https://flagshipserver.com/build/iso/flagship-base-alpine-3.21.0-x86_64.iso"
BASE_ISO_VERSION = "flagship-alpine-3.21.0-x86_64-apkovl1"
BASE_ISO_SHA256 = "5782da151ecc0328a0e10052405981d6807d9967f6e01836d1cf1c538768fb7d"

# Fly anycast IPs of the .services SNI passthrough listener. When DNS
# auto-publish is enabled (CLOUDFLARE_DNS_API_TOKEN secret set), the
# Worker writes A/AAAA records pointing each newly-registered server
# subdomain at these IPs.
SERVICES_PASSTHROUGH_IPV4 = "149.248.216.86"
SERVICES_PASSTHROUGH_IPV6 = "2a09:8280:1::110:d2b6:0"
# WebSocket URL daemons dial for the tunnel hub. Surfaced at
# /api/services/endpoints so daemons can discover migrations silently
# (no need to update each daemon's environment when we move the hub).
TUNNEL_HUB_URL = "wss://flagship-services.fly.dev:8443/tunnel"
# Cloudflare zone ID for flagship.services (DNS API target).
CLOUDFLARE_SERVICES_ZONE_ID = "51f3bfe11a729db57effd70ed3cf9c77"
# CLOUDFLARE_DNS_API_TOKEN is set via:
#   wrangler secret put CLOUDFLARE_DNS_API_TOKEN
# (Cloudflare API token with Zone:DNS:Edit on flagship.services.)
# Cloudflare Worker → Fly app shared secret. Set with:
#   wrangler secret put SERVICES_HMAC_KEY
# (NOT in this file — secrets live in CF dashboard.)

name = "flagship-com"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# Custom domains: Cloudflare auto-provisions DNS + cert and ALL traffic
# (every path) hits this Worker. The www CNAME chains to the apex so the
# www host shares the same Worker.
workers_dev = true

# Routes are wrangler-managed (declared in the `routes` array below).
# Every `wrangler deploy` reconciles to exactly the listed set — so to
# add or remove a route, edit this file and redeploy.
#
# Why Routes (not Custom Domains)? The apex retains a legacy CNAME →
# Surge from the old marketing site (backed up as
# `old_flagship_website.zip` at the repo root). Custom Domains insist
# on owning DNS for the host they attach to and refuse to attach to a
# host with externally-managed DNS records; Worker Routes intercept
# before origin lookup, so the legacy CNAME is simply never reached.
# `web.flagshipserver.com` is a CNAME → flagshipserver.com, proxied
# through Cloudflare; the universal SSL cert covers it.
#
# Discovered the hard way (2026-05-10): `wrangler deploy --routes X`
# reconciles to ONLY `X`, dropping every previously-attached route.
# Always pass the full set, or just trust the `routes` array here.
routes = [
  { pattern = "flagshipserver.com/*",          zone_name = "flagshipserver.com" },
  { pattern = "www.flagshipserver.com/*",      zone_name = "flagshipserver.com" },
  { pattern = "web.flagshipserver.com/*",      zone_name = "flagshipserver.com" },
  # Dedicated origin for WebAuthn-PRF recovery (C3/B1 fix). Putting the
  # passkey behind its own sub-origin gives WebAuthn rpId =
  # "recovery.flagshipserver.com" — different from the apex — so any XSS
  # on the marketing or webapp surface cannot reach the recovery
  # credential. The page is intentionally tiny and ships under a strict
  # CSP; runbook lives at docs/runbooks/recovery-subdomain.md.
  #
  # CUSTOM DOMAIN (not a zone route): recovery. had NO DNS record, so the zone
  # route never fired (a Worker Route only matches a host that already resolves
  # into Cloudflare). Same fix as boot. below — a custom domain lets wrangler
  # provision the proxied DNS record + edge cert itself, so the hostname
  # resolves to flagship-com with no manual DNS step / no dns:write token.
  # (Cut over 2026-06-14.)
  { pattern = "recovery.flagshipserver.com",   custom_domain = true },
  # boot.flagshipserver.com — the box/phone-facing BOOT operations
  # (`/api/boot/*`: auto-unlock lease release + the phone-gated approval
  # relay). Previously a SEPARATE worker (apps/boot) with its own D1 + a
  # shared-secret notify bridge back here; that bridge silently 401'd in
  # prod when the secret drifted, hanging the LUKS unlock with no error.
  # The boot operations now run on THIS worker, backed by `flagship-state`,
  # with the directory + owner push resolved in-process. The hostname +
  # contract are unchanged so the box/burner/phone need no change. This
  # route must point at flagship-com (and NOT at the old flagship-boot
  # worker) for the consolidation to take effect — apps/boot stays only as
  # an optional cloneable target. See docs/boot-worker-consolidation.md.
  #
  # CUSTOM DOMAIN (not a zone route): the flagshipserver.com zone has NO
  # wildcard DNS record, and a Worker Route only fires for a hostname that
  # already resolves into Cloudflare (web. has an explicit proxied CNAME;
  # recovery. — a route with no record — does not resolve at all). boot. used
  # to resolve solely via its custom domain on flagship-boot; moving it here as
  # a custom domain lets wrangler provision the proxied DNS record + edge cert
  # itself, so the hostname resolves to flagship-com with no manual DNS step.
  # (Cut over 2026-06-11 — detached from flagship-boot first.)
  { pattern = "boot.flagshipserver.com",       custom_domain = true },
]

# Static assets — marketing pages, the webapp source under /webapp/
# (served at root on web.flagshipserver.com via Worker rewrite),
# /deck/, /security pages, /.well-known/security.txt. Wrangler uploads
# everything in this directory to Cloudflare's static edge.
[assets]
directory = "../web/public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Worker runs first for every request so it can: (1) host-rewrite
# web.flagshipserver.com/X → asset /webapp/X before the assets edge
# applies its SPA fallback at the wrong root; (2) 308-redirect apex
# /webapp/* to web.; (3) handle /api/* and /build/iso/* directly. The
# Worker calls ASSETS.fetch as the default fallback for anything it
# doesn't intercept, so static-file behavior is unchanged for the
# marketing site — only one extra Worker invocation per request.
run_worker_first = ["/*"]

[[r2_buckets]]
binding = "ISO_BUCKET"
bucket_name = "flagship-iso"

# W11 — temp bucket the Worker streams personalized demo ISOs into.
# Cloud-init `user_data` on the temp Hetzner VPS wgets from this
# bucket's PUBLIC dev-url base (no presigned URL needed — the ISO is
# ephemeral and contains no PII). Enable public access once via:
#   wrangler r2 bucket dev-url enable flagship-iso-temp
# then copy the resulting `pub-…r2.dev` host into
# `FLAGSHIP_R2_TEMP_PUBLIC_BASE` under [vars] below.
[[r2_buckets]]
binding = "ISO_TEMP_BUCKET"
bucket_name = "flagship-iso-temp"

# D1 → R2 backup destination. Separate bucket from flagship-iso so a
# blast-radius event on user-facing ISO serving doesn't compromise the
# backup tail. Provision once via:
#   npx wrangler r2 bucket create flagship-backups
# Hourly snapshots are pruned by the scheduled handler after 30 days;
# monthly snapshots are kept indefinitely. If you'd rather enforce the
# 30-day window with a bucket-level lifecycle rule, point the rule at
# the `d1/hourly/` prefix only — never `d1/monthly/`.
[[r2_buckets]]
binding = "BACKUPS_BUCKET"
bucket_name = "flagship-backups"

# Cron triggers.
#  * `0 */6 * * *` — D1 → R2 backup (gzipped JSONL). First run of each
#    calendar month (UTC) also writes a monthly snapshot kept forever.
#    Also drives the custom-domain verification pass AND the server-side
#    CT-monitoring scan (crt.sh → owner push on an unexpected cert).
#  * `*/10 * * * *` — Plan A demo-user reaper (destroys idle Hetzner
#    VPSs past their per-row ttl_idle_minutes) AND provisioning poller
#    (promotes provisioning → up rows when Hetzner reports running +
#    install_events shows the daemon has registered). No-ops when
#    HCLOUD_TOKEN isn't configured, so this cron is safe to ship
#    before the demo-user system is provisioned.
[triggers]
crons = ["0 */6 * * *", "*/10 * * * *"]

# Rate-limit namespace shared across the four mutating control-plane
# endpoints. The Worker composes per-request keys of the form
# `<endpoint>|<axis>|<id>` (see apps/com/src/rateLimit.ts).
#
# The binding's (period, limit) below is set to the tightest threshold
# (3-per-15min) so that the recovery endpoint's usernameHash axis can
# actually fire. Endpoints with more generous budgets are protected by
# the in-Worker LIMITS table — see rateLimit.ts. The dashboard's
# advanced ratelimits are NOT used; the simple binding suffices.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 3, period = 900 }

# Dedicated namespace for /qr-pipe WebSocket upgrades (task P2). Each
# upgrade materialises a Durable Object (BUILD_RELAY) that pays the
# alarm + storage round-trip even with hibernation; left unbounded,
# the marketing apex's hero QR alone burned the free-tier DO duration
# budget. 30 upgrades per minute per IP comfortably covers a real
# user's reloads + the ~1-per-4-min pre-expire renewals while still
# capping a single source's fan-out to ~43k/day.
[[unsafe.bindings]]
name = "RATE_LIMITER_QR_PIPE"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

[[d1_databases]]
binding = "DB"
database_name = "flagship-state"
database_id = "d6f3bc03-0168-4988-8742-83346fdc923c"
migrations_dir = "../../packages/storage/migrations"

# Build-relay (task #59) — in-memory Durable Object that brokers a
# short-lived WebSocket session between the browser at /build/ and the
# user's phone/webapp. The DO sees only the browser's ephemeral
# X25519 public key (used to derive the visual match-code) and the
# opaque crypto_box_seal ciphertext on its way through. It never
# persists state — sessions live entirely in instance memory and
# self-destroy on disconnect or after a 5-minute TTL.
[[durable_objects.bindings]]
name = "BUILD_RELAY"
class_name = "BuildRelaySession"

[[migrations]]
tag = "v1"
# Cloudflare's free plan requires SQLite-backed Durable Objects (not the
# legacy KV-backed shape). new_sqlite_classes works on both free and paid
# plans, so it's the right default. Switched from new_classes 2026-05-12
# after a deploy was rejected with: "In order to use Durable Objects with
# a free plan, you must create a namespace using a new_sqlite_classes
# migration. [code: 10097]".
new_sqlite_classes = ["BuildRelaySession"]

[vars]
# Apex roots, as CONFIG (docs/ui-test-gym.md §6.5 / §12-G1). PROD VALUES =
# today's literals, so this Worker is byte-identical to before. The `gym.`
# test Worker (a separate wrangler config / --name) overrides these to
# `gym.flagship.services` / `gym.flagshipserver.com` to serve the isolated
# test env on the SAME zones. SERVICES_APEX threads into serverDomain
# validation, the user-zone CAA anchor, the DNS-01 own-name fence, and apex
# cleanup; unset ⇒ the prod literal everywhere (so signed-domain / canonical
# vectors never move).
SERVICES_APEX = "flagship.services"
CONTROL_APEX = "flagshipserver.com"
# Fly's TLS-term endpoint (port 8443). The flagship.services apex itself
# runs SNI passthrough on :443, so https://flagship.services/api/* will
# always 525. The Worker proxies any /api/* path it doesn't handle to
# this endpoint instead. (For end-to-end requests, clients should use
# `flagshipserver.com` for API and `<server>.<user>.flagship.services`
# for user content.)
SERVICES_BASE_URL = "https://flagship-services.fly.dev:8443"
# `flagship-base-alpine-...` = stock Alpine 3.21 with our apkovl baked at
# the root of the ISO9660 filesystem. The apkovl carries:
#   /etc/local.d/01-flagship-bootstrap.start
#   /usr/local/bin/flagship-trailer-probe
#   /usr/local/bin/flagship-trailer-validate
# On boot, Alpine's overlay-init loads the apkovl, the bootstrap script
# probes the boot media for the trailer, validates the signature, and
# fetches installer/install.sh from GitHub at the trailer-pinned ref.
BASE_ISO_URL = "https://flagshipserver.com/build/iso/flagship-base-alpine-3.21.0-x86_64-apkovl3-debug3.iso"
BASE_ISO_VERSION = "flagship-alpine-3.21.0-x86_64-apkovl3-debug"
BASE_ISO_SHA256 = "52bbb7432dade2b6a86be483d00edd95df02a34b84bb4d9ca9a8dfddd71cc653"

# W12 — Debian-12-netinst-based base ISO used by the cloud demo path
# (admin-snapshot-now). Alpine apkovl-mode boot doesn't load the
# modloop kernel-modules squashfs on Hetzner cloud VMs so DHCP never
# comes up; the netboot ISO uses d-i, whose installer kernel has
# every common driver built IN. Build via:
#   scripts/build-flagship-netboot-iso.sh out/flagship-netboot.iso
# Upload to R2 under FLAGSHIP_NETBOOT_ISO_KEY and serve via the
# existing /build/iso/:filename Worker route.
FLAGSHIP_NETBOOT_ISO_URL = "https://flagshipserver.com/build/iso/flagship-netboot-trixie-amd64-v5.iso"
FLAGSHIP_NETBOOT_ISO_KEY = "flagship-netboot-trixie-amd64-v5.iso"

# Blessed base ISO for the desktop burner's Simple mode, served by
# POST /api/iso-manifest (see docs/iso-manifest.md). The burner is a dumb
# executor: it reports the ISO it has and downloads this one if the sha
# differs. NON-SECRET (public Debian facts) — lives in [vars], not a secret.
#   - `sha256` is the OFFICIAL value from Debian's signed SHA256SUMS
#     (the `attestation` url; verify the sums file against SHA256SUMS.sign).
#   - `url` is version-pinned (NOT the rotating current/ symlink) so url+sha
#     stay consistent. When Debian ships a new point release, re-pin all
#     three (version/url/sha256) HERE and deploy — no burner reship. Once
#     13.5.0 is archived, swap the host to cdimage's /cdimage/archive/ path
#     or to our own R2 copy of the same bytes (sha is unchanged).
#   - TOML literal string (single quotes): inner JSON double-quotes are kept verbatim.
FLAGSHIP_ISO_MANIFEST = '{"version":"debian-13.5.0","url":"https://cdimage.debian.org/debian-cd/13.5.0/amd64/iso-cd/debian-13.5.0-amd64-netinst.iso","sha256":"95838884f5ea6c82421dfe6baaa5a639dbbe6756c1e380f9fe7a7cb0c1949d2a","sizeBytes":791674880,"attestation":"https://cdimage.debian.org/debian-cd/13.5.0/amd64/iso-cd/SHA256SUMS"}'

# W11 — `[varname]` block consumed by the admin-snapshot-now handler.
# `FLAGSHIP_R2_TEMP_PUBLIC_BASE` is the public dev-url host for the
# `flagship-iso-temp` R2 bucket (enabled once via
# `wrangler r2 bucket dev-url enable flagship-iso-temp`). The
# cloud-init `user_data` script concatenates `${BASE}/${R2_KEY}` and
# wgets the result. Update if the bucket is re-created (the
# `pub-…r2.dev` host changes).
FLAGSHIP_R2_TEMP_PUBLIC_BASE = "https://pub-260717b8631044a0bcee80ce0de8f7f9.r2.dev"
# R2 object key for the base Alpine ISO inside ISO_BUCKET. NOTE: the
# stored key is the BARE filename — NOT prefixed with `build/iso/`.
# (The `/build/iso/:filename` route in apps/com/src/route.ts strips
# the prefix before calling ISO_BUCKET.get(), so the on-disk key is
# unprefixed. Probed live 2026-05-21: 250 937 344 bytes at this key.)
FLAGSHIP_BASE_ISO_KEY = "flagship-base-alpine-3.21.0-x86_64-apkovl3-debug3.iso"

# Fly anycast IPs of the .services SNI passthrough listener. When DNS
# auto-publish is enabled (CLOUDFLARE_DNS_API_TOKEN secret set), the
# Worker writes A/AAAA records pointing each newly-registered server
# subdomain at these IPs.
SERVICES_PASSTHROUGH_IPV4 = "149.248.216.86"
SERVICES_PASSTHROUGH_IPV6 = "2a09:8280:1::110:d2b6:0"
# WebSocket URL daemons dial for the tunnel hub. Surfaced at
# /api/services/endpoints so daemons can discover migrations silently
# (no need to update each daemon's environment when we move the hub).
TUNNEL_HUB_URL = "wss://flagship-services.fly.dev:8443/tunnel"
# Cloudflare zone ID for flagship.services. Used ONLY in the legacy
# direct-CF-token mode below; production routes DNS through the
# dns-broker Worker via DNS_BROKER_URL.
CLOUDFLARE_SERVICES_ZONE_ID = "51f3bfe11a729db57effd70ed3cf9c77"
# Arms the #30 maintainer→CA chokepoint: when this is exactly "true"
# the ca-gate refuses to sign UserPubKeyBinding / DemoDirective unless
# `authorizedCaKeys(...)` (verified forward from
# MAINTAINER_PINNED_MANDATE_HASH over the committed ca-track mandates +
# CaEndorsement bundle) currently lists the live FLAGSHIP_CA_PRIV_HEX
# pubkey. Any other value = OBSERVE (logs verdict, signs anyway).
# A LAPSED CaEndorsement under ENFORCE = a hard directory-attestation
# outage by design. Renew before notAfter; to stand down, remove this
# line and redeploy (instant, no state change). First armed
# 2026-05-19 against pubkey 230ad9ed…1cd235cc, lease through
# 2026-06-02T22:40:29.858Z.
CA_ENDORSEMENT_ENFORCE = "true"
# DnsBroker Worker (Task #13) — when set, the main Worker forwards ALL
# DNS mutations to the broker. Production posture: drop
# CLOUDFLARE_DNS_API_TOKEN from this Worker entirely and set this var
# to the broker's public URL. The broker holds the only copy of the CF
# DNS token. See `apps/dns-broker/README.md`.
# DNS_BROKER_URL = "https://flagship-dns-broker.workers.dev"
#
# Legacy: CLOUDFLARE_DNS_API_TOKEN was set via:
#   wrangler secret put CLOUDFLARE_DNS_API_TOKEN
# (Cloudflare API token with Zone:DNS:Edit on flagship.services.)
# Once DNS_BROKER_URL is set above, this secret can — and SHOULD — be
# deleted from this Worker via `wrangler secret delete`.
# Cloudflare Worker → Fly app shared secret. Set with:
#   wrangler secret put SERVICES_HMAC_KEY
# (NOT in this file — secrets live in CF dashboard.)

# Web Push (RFC 8030 + VAPID per RFC 8292) for the webapp.
# Mint a VAPID key pair once via `npx tsx scripts/generate-vapid.ts`,
# then load:
#   wrangler secret put WEBPUSH_VAPID_PRIVATE_KEY_PEM     # PKCS8 ES256
#   wrangler secret put WEBPUSH_VAPID_PUBLIC_KEY_B64URL   # uncompressed P-256
#   wrangler secret put WEBPUSH_CONTACT                    # mailto:harry@flagship.services
# The public key is exposed at /api/push/vapid-public-key for the
# webapp's PushManager.subscribe() call.
#
# iOS uses APNs (APNS_* secrets above); Android uses FCM (FCM_*).
# All three platforms hit the same /api/push/register endpoint, so
# the webapp registration path doesn't need a separate "is webapp"
# branch on .com — `platform=webpush` does the dispatch.

# v2 device-addressing (S3.3). DEMO_IRK_KEK is a 32-byte hex Worker
# secret used to derive deterministic User IRKs for demo accounts via
# HKDF (salt='flagship-demo-irk-v1', info='user-irk'). When unset, the
# two new admin endpoints (admin-claim-and-issue + admin-mint-device-
# grant) return 503 and the CLI's `create-sample-user` falls back to
# its synthesizeBlob path (which produces a daemon-incompatible blob
# — non-production). Generate once via:
#   wrangler secret put DEMO_IRK_KEK   # paste output of `openssl rand -hex 32`
# Never appears in code, logs, or D1. Rotating it invalidates every
# previously-issued demo IRK — a re-create of every demo user is
# required after rotation.

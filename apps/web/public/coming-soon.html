<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Flagship — coming soon</title>
  <meta name="description" content="Flagship — a personal cloud you actually own. Coming soon.">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="robots" content="noindex">
  <meta property="og:title" content="Flagship — coming soon">
  <meta property="og:description" content="A personal cloud you actually own. Open source. Coming soon.">
  <meta property="og:url" content="https://flagshipserver.com/">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.svg">
  <!-- Canonical palette (+ dark mode) from tokens; theme-ui.css adds logo +
       toggle. The page keeps only its own deep-teal accent below. -->
  <link rel="stylesheet" href="/tokens.css">
  <style>
    :root {
      --teal:   #0F8B7E;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--canvas);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    ::selection { background: var(--teal); color: var(--canvas); }
    main {
      max-width: 540px;
      text-align: center;
    }
    .blurb {
      margin: 0 auto 28px;
      max-width: 38ch;
    }
    .repo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 13px;
      color: var(--ink);
      text-decoration: none;
      padding: 8px 14px;
      border: 1px solid var(--rule);
      border-radius: 4px;
      transition: border-color 160ms ease, color 160ms ease;
    }
    .repo:hover, .repo:focus-visible {
      color: var(--teal);
      border-color: var(--teal);
      outline: none;
    }
    .repo svg { width: 14px; height: 14px; }
    .mark {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 28px;
    }
    .mark .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 12px var(--teal);
    }
    h1 {
      font-weight: 500;
      font-size: clamp(34px, 6vw, 56px);
      line-height: 1.05;
      letter-spacing: -0.02em;
      margin: 0 0 18px;
      color: var(--ink);
    }
    .accent { color: var(--teal); }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
    }
    footer {
      position: fixed;
      bottom: 24px;
      left: 0; right: 0;
      text-align: center;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
  </style>
  <link rel="stylesheet" href="/theme-ui.css">
  <script src="/theme.js"></script>
</head>
<body>
  <main>
    <p class="mark"><svg class="fs-logo" viewBox="0 0 64 64" aria-hidden="true"><rect class="lg-frame" x="7" y="7" width="50" height="50" rx="7"/><circle class="lg-ring" cx="32" cy="32" r="18"/><circle class="lg-core" cx="32" cy="32" r="16"/></svg>Flagship</p>
    <h1>Coming <span class="accent">soon</span>.</h1>
    <p class="blurb">A personal cloud you actually own — your stuff, on hardware you control</p>
    <a class="repo" href="https://github.com/ibisllc/flagship" rel="noopener">
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8a8 8 0 005.47 7.59c.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.42 7.42 0 014 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      github.com/ibisllc/flagship
    </a>
  </main>
  <footer>hello@flagshipserver.com · Patent Pending</footer>
</body>
</html>

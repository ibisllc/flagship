  <script src="/theme.js"></script>
    <script>
      // The /build/ personalize-and-write-ISO flow is retired. The Flagship
      // Assembler now builds the boot USB from a recipe + a stock Linux image.
      // Forward anyone who arrived mid-flow (a pending recipe, or the old
      // ?via=qr hand-off) to /ready/; send everyone else to the homepage.
      (function () {
        var hasRecipe = false;
        try { hasRecipe = !!sessionStorage.getItem("flagship:qr:recipe"); } catch (e) {}
        var viaQr = location.search.indexOf("via=qr") !== -1;
        location.replace(hasRecipe || viaQr ? "/ready/" : "/");
      })();
    </script>

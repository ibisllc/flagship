<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting · Flagship</title>
    <meta http-equiv="refresh" content="0; url=/deck/" />
    <link rel="canonical" href="/deck/" />
  </head>
  <body>
    <p>The dashboard moved to <a href="/deck/">/deck/</a>. Redirecting…</p>
    <script>
      // Preserve any existing session= query param across the redirect.
      const params = new URLSearchParams(location.search);
      const sid = params.get("session");
      const target = sid ? "/deck/?session=" + encodeURIComponent(sid) : "/deck/";
      location.replace(target);
    </script>
  </body>
</html>

    }
  </style>
  <rect class="lg-frame" x="7" y="7" width="50" height="50" rx="7"/>
  <circle class="lg-ring" cx="32" cy="32" r="18"/>
  <circle class="lg-core" cx="32" cy="32" r="16"/>
</svg>

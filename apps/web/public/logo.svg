<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Flagship logo">
  <style>
    .lg-frame { fill: #0A0A09; }
    .lg-ring  { fill: #FFFFFF; }
    .lg-core  { fill: #14B8A6; }
    @media (prefers-color-scheme: dark) {
      .lg-frame { fill: #14B8A6; }
      .lg-ring  { fill: #14B8A6; }

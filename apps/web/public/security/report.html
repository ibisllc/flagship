<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Report a vulnerability · Flagship</title>
    <style>
      :root { color-scheme: dark light; font-family: ui-sans-serif, system-ui, sans-serif; }
      body { max-width: 38rem; margin: 3rem auto; padding: 0 1.5rem; line-height: 1.6; }
      h1 { font-size: 1.75rem; margin: 0 0 0.5rem; }
      .tag { color: #888; margin-bottom: 2rem; }
      label { display: block; margin: 1rem 0 0.25rem; font-weight: 600; }
      input, textarea, select {
        width: 100%; box-sizing: border-box;
        padding: 0.6rem; border-radius: 6px; border: 1px solid #8886;
        font: inherit; background: transparent; color: inherit;
      }
      textarea { min-height: 12rem; resize: vertical; }
      button { font: inherit; padding: 0.6rem 1.2rem; border-radius: 6px; cursor: pointer; margin-top: 1.5rem; }
      .nav { color: #888; margin-bottom: 2rem; }
      .nav a { margin-right: 1rem; }
      .out { margin-top: 1.5rem; padding: 1rem; border-radius: 6px; }
      .ok { background: #1d40; border: 1px solid #4a8; }
      .err { background: #401; border: 1px solid #a44; }
      .alt { color: #888; margin-top: 1.5rem; font-size: 0.95rem; }
    </style>
  </head>
  <body>
    <div class="nav">
      <a href="/">← home</a>
      <a href="/security.html">← security</a>
    </div>

    <h1>Report a vulnerability</h1>
    <p class="tag">Thanks for taking the time. We aim to acknowledge within 48 hours.</p>

    <form id="form">
      <label for="email">Your email <span style="color:#888;font-weight:normal">(so we can reply — optional but recommended)</span></label>
      <input id="email" name="email" type="email" placeholder="you@example.com" />

      <label for="severity">Severity (your guess)</label>
      <select id="severity" name="severity">
        <option value="critical">Critical — remote unauth, key compromise, data exfil</option>
        <option value="high" selected>High — privilege escalation, account takeover</option>
        <option value="medium">Medium — info disclosure, partial bypass</option>
        <option value="low">Low — minor, requires unusual conditions</option>
      </select>

      <label for="component">Component</label>
      <select id="component" name="component">
        <option>Protocol / crypto</option>
        <option>Server daemon</option>
        <option>Boot image / image-builder</option>
        <option>iOS app</option>
        <option>Android app</option>
        <option>Control plane (flagshipserver.com)</option>
        <option>Tunnel / public ingress</option>
        <option>Other</option>
      </select>

      <label for="summary">Summary <span style="color:#a44">*</span></label>
      <input id="summary" name="summary" required maxlength="200" placeholder="One-line description" />

      <label for="details">Details, repro steps, impact <span style="color:#a44">*</span></label>
      <textarea id="details" name="details" required maxlength="20000" placeholder="What did you do, what happened, why it matters."></textarea>

      <button type="submit">Submit report</button>
    </form>

    <div id="out"></div>

    <p class="alt">Prefer email? Send to
      <a href="mailto:security@flagshipserver.com">security@flagshipserver.com</a>.
      PGP encouraged.
    </p>

    <script type="module">
      const form = document.getElementById("form");
      const out = document.getElementById("out");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        out.className = "";
        out.textContent = "Submitting…";
        const data = Object.fromEntries(new FormData(form).entries());
        try {
          const r = await fetch("/api/security/report", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify(data),
          });
          const body = await r.json();
          if (r.ok) {
            out.className = "out ok";
            out.textContent = `Thank you. Reference: ${body.reportId}. We'll be in touch.`;
            form.reset();
          } else {
            out.className = "out err";
            out.textContent = body.error ?? `Submission failed (HTTP ${r.status}).`;
          }
        } catch (err) {
          out.className = "out err";
          out.textContent = "Network error. Please email security@flagshipserver.com directly.";
        }
      });
    </script>
  </body>
</html>

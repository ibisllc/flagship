[workspace]
resolver = "2"
members = [
    "crates/flagship-protocol",
    "crates/flagship-crypto",
    "crates/flagship-keyd",
    "crates/flagship-broker",
    "crates/flagship-runtime",
    "crates/flagship-core",
    "crates/flagship-boot",
    "crates/flagship-ingress",
    "crates/flagship-relay",
    "crates/flagship-gpu",
    "crates/flagship-wasi",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
license = "BUSL-1.1"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
dbg_macro = "deny"
todo = "deny"
print_stdout = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
debug = false
overflow-checks = true

[profile.dev]
overflow-checks = true

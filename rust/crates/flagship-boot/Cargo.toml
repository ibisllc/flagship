[package]
name = "flagship-boot"
description = "Early-boot unlock client, interoperable with the v1 unseal helper (installer/unseal-helper)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "flagship-boot"
path = "src/main.rs"

[dependencies]
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
base64ct = { version = "=1.8.3", features = ["alloc"] }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["zeroize"] }
getrandom = { version = "=0.4.3", features = ["std"] }
hkdf = "=0.13.0"
serde = { version = "=1.0.228", default-features = false, features = ["std"] }
serde_json = { version = "=1.0.150", default-features = false, features = ["std", "raw_value"] }
sha2 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
x25519-dalek = { version = "=3.0.0", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = { version = "=1.9.1", features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.4", default-features = false, features = ["std", "process"] }

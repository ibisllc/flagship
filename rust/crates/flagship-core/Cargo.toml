[package]
name = "flagship-core"
description = "Unprivileged controller: durable operation journal, desired state and single-writer reconciliation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
flagship-runtime = { path = "../flagship-runtime" }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
rustix = { version = "=1.1.5", features = ["fs"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
thiserror = "=2.0.20"

[dev-dependencies]
flagship-runtime = { path = "../flagship-runtime", features = ["fake"] }

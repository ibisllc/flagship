[package]
name = "flagship-wasi"
description = "Confined WASI worker with brokered capabilities and hard resource limits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Cranelift compiles inside the worker; no cache, no pooling allocator, no
# component-model-async/threads/gc beyond what wasmtime-wasi's p1 needs.
wasmtime = { version = "=49.0.2", default-features = false, features = ["cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "=49.0.2", default-features = false, features = ["p1"] }
wat = { version = "=1.258.3", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.11.0"
thiserror = "=2.0.20"
# Wall-clock deadlines that also cancel host calls blocked inside WASI.
tokio = { version = "=1.53.2", default-features = false, features = ["rt", "time"] }

[dev-dependencies]
tempfile = "=3.23.0"

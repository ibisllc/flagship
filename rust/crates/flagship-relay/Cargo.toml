[package]
name = "flagship-relay"
description = "Opaque-stream relay: tunnel frame protocol v1, SNI routing and bounded per-stream flow control."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Test builds only (tools/relay-conformance): FLAGSHIP_OUTBOUND_CONFORMANCE_UPSTREAM maps one host to a public-looking
# address and that address to a local upstream, so a successful outbound splice can be compared with the TS hub. The
# release image (Dockerfile.relay) never enables it.
conformance = []

[dependencies]
sha2 = { version = "=0.11.0", default-features = false }
flagship-protocol = { path = "../flagship-protocol" }
bytes = { version = "=1.12.1", default-features = false, features = ["std"] }
http-body-util = { version = "=0.1.5", default-features = false }
hyper = { version = "=1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
flagship-crypto = { path = "../flagship-crypto" }
flagship-access = { path = "../flagship-access" }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
getrandom = { version = "=0.4.3", default-features = false }
zeroize = { version = "=1.9.1", default-features = false }
tokio = { version = "=1.53.3", default-features = false, features = ["rt", "rt-multi-thread", "signal", "net", "io-util", "time", "sync", "macros"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = { version = "=1.0.11", default-features = false }

[dev-dependencies]
tokio = { version = "=1.53.3", default-features = false, features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "test-util"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "handshake"] }

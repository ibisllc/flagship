[package]
name = "flagship-relay"
description = "Opaque-stream relay: tunnel frame protocol v1, SNI routing and bounded per-stream flow control."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
tokio = { version = "=1.53.2", default-features = false, features = ["rt", "net", "io-util", "time", "sync", "macros"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }

[dev-dependencies]
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "=1.53.2", default-features = false, features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "handshake"] }

[package]
name = "flagship-updater"
description = "The box's independent updater, rollback and recovery supervisor: verifies a signed release artifact, stages it, switches to it atomically and recovers from an interrupted or unhealthy update without Node."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "flagship-updater"
path = "src/main.rs"

[dependencies]
flagship-crypto = { path = "../flagship-crypto" }
flagship-protocol = { path = "../flagship-protocol" }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
sha2 = { version = "=0.11.0", default-features = false }
rustix = { version = "=1.1.4", default-features = false, features = ["std", "process", "fs"] }

[dev-dependencies]
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }

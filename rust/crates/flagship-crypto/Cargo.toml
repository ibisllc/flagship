[package]
name = "flagship-crypto"
description = "Small reviewed wrapper over the selected crypto providers: classical suites, hybrid X25519+ML-KEM-768 sealing and Ed25519+ML-DSA-65 AND-signatures."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
flagship-protocol = { path = "../flagship-protocol" }
x-wing = { version = "=0.1.1", default-features = false, features = ["zeroize"] }
x25519-dalek = { version = "=3.0.0", default-features = false, features = ["static_secrets", "zeroize"] }
ml-dsa = { version = "=0.1.1", default-features = false, features = ["alloc", "rand_core", "zeroize"] }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
hkdf = { version = "=0.13.0", default-features = false }
sha2 = { version = "=0.11.0", default-features = false }
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "zeroize"] }
zeroize = { version = "=1.9.1", default-features = false }
getrandom = { version = "=0.4.3", default-features = false }
rand_core = { version = "=0.10.1", default-features = false }

[dev-dependencies]
serde_json = "=1.0.151"

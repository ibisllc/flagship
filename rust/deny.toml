# cargo-deny policy (IMPLEMENTATION-PLAN.md 5.2): pinned, licensed, advisory-free dependencies.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # crypto-bigint 0.7 is on the fixed 0.7.6; 0.5.5 has no fixed release and is reached only as a
  # dev-dependency (p256 0.13 in flagship-ingress's tests). No shipped binary links it.
  { id = "RUSTSEC-2026-0387", reason = "only crypto-bigint 0.5.5 remains, test-only via p256 0.13 (dev-dependency of flagship-ingress)" },
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "MPL-2.0", "CDLA-Permissive-2.0"]
confidence-threshold = 0.9
# The workspace's own crates are BUSL-1.1 and never published.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

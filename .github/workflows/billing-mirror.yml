name: billing mirror (disabled)

# Mirrors billing/ to github.com/ibisllc/billing as its own repository, with
# history limited to billing/ commits (git subtree split).
#
# DISABLED until the owner approves the mirror. To enable (see
# billing/docs/publishing.md):
#   1. Create the empty public repository ibisllc/billing.
#   2. Add an SSH deploy key with write access there and store its private
#      half here as the secret BILLING_MIRROR_DEPLOY_KEY.
#   3. Delete the `if: false` line below.
# It never publishes to npm; that is a separate, manual step.

on:
  push:
    branches: [main]
    paths:
      - "billing/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: billing-mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout (full history for subtree split)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Split billing/ into its own history
        run: git subtree split --prefix=billing -b billing-mirror

      - name: Push to ibisllc/billing
        env:
          DEPLOY_KEY: ${{ secrets.BILLING_MIRROR_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/billing_mirror
          chmod 600 ~/.ssh/billing_mirror
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          GIT_SSH_COMMAND="ssh -i ~/.ssh/billing_mirror -o IdentitiesOnly=yes" \
            git push git@github.com:ibisllc/billing.git billing-mirror:main

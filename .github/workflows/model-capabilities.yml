name: Model capability table

# Daily refresh of D1 `model_capabilities` from OpenRouter's public catalog. It used to
# run in the Worker's daily cron: about 350 models parsed and upserted cost 33 ms of
# CPU against the Workers Free plan's 10 ms, so it runs here, through the same
# `refreshModelCapabilities` the Worker used, over `wrangler d1 execute`.
# Needs the repo secrets CLOUDFLARE_API_TOKEN (D1 Edit) and CLOUDFLARE_ACCOUNT_ID.

on:
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npx tsc -b packages/protocol packages/control-plane
      - name: Refresh
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::repo secret CLOUDFLARE_API_TOKEN is not set"; exit 1; }
          npx tsx scripts/refresh-model-capabilities.ts --remote

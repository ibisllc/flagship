name: Marketplace security scan (nightly auto-trigger)

# The auto-trigger half of the marketplace security-scan service
# (#14, §L). The scanner itself (services/marketplace-scanner +
# scripts/scan-marketplace-listing.sh) and the .com result webhook
# (POST /api/marketplace/:c/:s/scan, scanner-Ed25519-verified) already
# exist. The missing piece was that nothing DRAINS the work: listings
# shipped scan_grade=NULL forever. This job fixes that — nightly it
# pulls the authed scan queue (listed listings never-scanned or whose
# last scan is older than STALE_DAYS) and runs the scanner per entry.
#
# Auth: the same constant-time bearer (SERVICES_CONTROL_SECRET) the
# other /api/internal/* endpoints use — set as a repo secret.
#
# Image resolution caveat (the one remaining operator detail, stated
# honestly like build-iso.yml's runner-pinning note): the listing
# record stores creator/slug/canonicalUrl/manifestHashHex, NOT the
# docker image ref. scan-marketplace-listing.sh takes the image as $3;
# the resolution convention (read it from the app manifest served at
# canonicalUrl) is the documented operator step — the queue + drain
# loop is what this workflow guarantees.

on:
  schedule:
    - cron: "17 4 * * *" # 04:17 UTC nightly
  workflow_dispatch:
    inputs:
      stale_days:
        description: "Re-scan listings whose last scan is older than this many days (default 30)"
        required: false
        default: "30"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-22.04
    env:
      COM_BASE: https://flagshipserver.com
      STALE_DAYS: ${{ github.event.inputs.stale_days || '30' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch the authed scan queue
        id: queue
        run: |
          set -euo pipefail
          resp=$(curl -fsS \
            -H "authorization: Bearer ${{ secrets.SERVICES_CONTROL_SECRET }}" \
            "$COM_BASE/api/internal/marketplace-scan-queue?staleDays=$STALE_DAYS")
          echo "$resp" | jq -c '.queue' > queue.json
          n=$(jq 'length' queue.json)
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "Scan queue: $n listing(s) need a (re)scan."
          jq -r '.[] | "  - \(.creator)/\(.slug)  (last: \(.scanCompletedAt // "never"))"' queue.json

      - name: Install scanner deps (Trivy + docker)
        if: steps.queue.outputs.count != '0'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq --no-install-recommends jq
          curl -fsSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          trivy --version | head -1

      - name: Drain the queue — scan each listing + post the signed result
        if: steps.queue.outputs.count != '0'
        env:
          FLAGSHIP_SCANNER_PRIV_HEX: ${{ secrets.FLAGSHIP_SCANNER_PRIV_HEX }}
          FLAGSHIP_R2_BUCKET: ${{ secrets.FLAGSHIP_R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.R2_ENDPOINT_URL_S3 }}
        run: |
          set -uo pipefail
          fail=0
          jq -c '.[]' queue.json | while read -r row; do
            creator=$(echo "$row" | jq -r '.creator')
            slug=$(echo "$row" | jq -r '.slug')
            canonical=$(echo "$row" | jq -r '.canonicalUrl')
            # Image-resolution convention (operator step): the app's
            # manifest at the canonical URL pins its image. We pass the
            # canonical so the script resolves it; a listing that can't
            # be resolved is logged + skipped (not fatal — the next
            # nightly retries; it just stays NULL meanwhile).
            echo "::group::scan $creator/$slug"
            if ! bash scripts/scan-marketplace-listing.sh "$creator" "$slug" "$canonical"; then
              echo "::warning::scan failed for $creator/$slug — will retry next run"
              fail=1
            fi
            echo "::endgroup::"
          done
          # A per-listing failure must not fail the whole nightly (the
          # queue self-heals next run); only an infra error should.
          exit 0

name: iso-manifest URLs still resolve

# The blessed base-ISO manifests (FLAGSHIP_ISO_MANIFEST*) pin download URLs on
# cdimage.debian.org. Debian moves a release from cdimage/release/ to
# cdimage/archive/ the day the next point release ships, which silently
# 404s Studio's Simple-mode download for anyone without a cached image
# (2026-10-08: 13.7.0 shipped, the 13.6.0 pin broke). A failed scheduled run
# emails the repo owner.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/com/wrangler.toml"
      - ".github/workflows/iso-manifest-urls.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Every manifest URL answers 200
        run: |
          urls="$(grep -E '^FLAGSHIP_ISO_MANIFEST[A-Z0-9_]* = ' apps/com/wrangler.toml \
            | grep -oE '"(url|attestation)":"[^"]+"' | cut -d'"' -f4)"
          [ -n "$urls" ] || { echo "::error::no manifest URLs found"; exit 1; }
          fail=0
          for u in $urls; do
            if curl -fsIL --retry 3 --max-time 60 -o /dev/null "$u"; then
              echo "ok   $u"
            else
              echo "::error::unreachable: $u"
              fail=1
            fi
          done
          exit $fail

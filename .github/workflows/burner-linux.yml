name: burner-linux (pytest + render smoke)

# The Linux burner's pure layer is pytest-covered but its GTK view layer is
# only exercised when a window is actually built — which is how it shipped
# with two render-fatal bugs (Adw.ToolbarView needs adw >= 1.4; a GTK3-only
# ScrolledWindow call) that no unit test could see. This runs the headless
# suite plus render_smoke.py under xvfb on BOTH libadwaita generations:
# ubuntu-latest (adw >= 1.4, the ToolbarView path) and debian:12 (adw 1.2,
# the fallback path Crostini/bookworm users get).

on:
  pull_request:
    paths:
      - "apps/burner-linux/**"
      - ".github/workflows/burner-linux.yml"
  push:
    branches: [main]
    paths:
      - "apps/burner-linux/**"
      - ".github/workflows/burner-linux.yml"

permissions:
  contents: read

jobs:
  pytest-and-render:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-latest (adw 1.4+)
            runner: ubuntu-latest
            container: ""
          - name: debian-12 (adw 1.2 fallback)
            runner: ubuntu-latest
            container: "debian:12"
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK4 + libadwaita + xvfb + pytest
        run: |
          if command -v sudo >/dev/null 2>&1; then SUDO=sudo; else SUDO=; fi
          $SUDO apt-get update -qq
          $SUDO apt-get install -y -qq --no-install-recommends \
            python3 python3-pytest python3-gi \
            gir1.2-gtk-4.0 gir1.2-adw-1 libadwaita-1-0 \
            xvfb xauth fonts-dejavu-core

      - name: Headless unit suite
        run: python3 -m pytest apps/burner-linux/tests/ -q

      - name: Render smoke (xvfb)
        run: xvfb-run -a python3 apps/burner-linux/render_smoke.py

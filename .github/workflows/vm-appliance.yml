name: vm-appliance (amd64 generalized base under KVM)

# Manufactures the prebuilt VM appliance from Debian's official generic cloud
# image with scripts/build-vm-appliance-cloud-qemu.sh (guest success marker +
# independent boot smoke), then compresses and splits it into the 256 MiB parts
# the distribution manifest describes. Mac/HVF is not a release factory
# (AGENTS.md, 2026-07-21), so this is the reproducible path. Publishing the parts
# to R2 and committing the manifest stay manual.

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Flagship ref the appliance installs (must match recipes' installerGitRef)"
        default: "main"
      debian_build:
        description: "cloud.debian.org trixie build directory"
        default: "20261001-2618"
      debian_sha512:
        description: "SHA-512 of debian-13-generic-amd64.qcow2 in that build"
        default: "6f0f93335bdef4ccf523c4317cc663ea52ca23b862667785f3d6d186ab4674a937385ccff0c55996b4b2e4c19e440cdf211e2a75ffa2f6548037ab43950c841d"

permissions:
  contents: read

jobs:
  amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Install QEMU + OVMF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils ovmf
          ls /usr/share/OVMF/

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci
      - run: npx tsc -b

      - name: Download the pinned Debian cloud image
        run: |
          curl -fsSL -o "$RUNNER_TEMP/debian-13-generic-amd64.qcow2" \
            "https://cloud.debian.org/images/cloud/trixie/${{ inputs.debian_build }}/debian-13-generic-amd64-${{ inputs.debian_build }}.qcow2"

      - name: Build the appliance (factory + boot smoke)
        env:
          FLAGSHIP_QEMU_CODE: /usr/share/OVMF/OVMF_CODE_4M.fd
          FLAGSHIP_QEMU_VARS: /usr/share/OVMF/OVMF_VARS_4M.fd
        run: |
          bash scripts/build-vm-appliance-cloud-qemu.sh \
            "$RUNNER_TEMP/debian-13-generic-amd64.qcow2" "${{ inputs.debian_sha512 }}" \
            "$RUNNER_TEMP/base.raw" amd64 "${{ inputs.git_ref }}"
          cat "$RUNNER_TEMP/base.raw.json"

      - name: Compress, split and write the distribution manifest
        env:
          GIT_REF: ${{ inputs.git_ref }}
          SOURCE_SHA512: ${{ inputs.debian_sha512 }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          raw="$RUNNER_TEMP/base.raw"
          raw_sha=$(sha256sum "$raw" | awk '{print $1}')
          raw_size=$(stat -c %s "$raw")
          qemu-img convert -c -O qcow2 "$raw" "$RUNNER_TEMP/appliance.qcow2"
          rm -f "$raw"
          sha=$(sha256sum "$RUNNER_TEMP/appliance.qcow2" | awk '{print $1}')
          size=$(stat -c %s "$RUNNER_TEMP/appliance.qcow2")
          ref_slug=$(printf %s "$GIT_REF" | tr -c 'a-zA-Z0-9.-' '-')
          prefix="flagship-vm-appliance-amd64-${ref_slug}-${sha:0:12}.qcow2"
          split -b 268435456 -d -a 2 "$RUNNER_TEMP/appliance.qcow2" "$out/$prefix.part-"
          rm -f "$RUNNER_TEMP/appliance.qcow2"
          RAW_SHA=$raw_sha RAW_SIZE=$raw_size SHA=$sha SIZE=$size PREFIX=$prefix OUT=$out python3 - <<'EOF'
          import hashlib, json, os, pathlib
          out = pathlib.Path(os.environ["OUT"]); prefix = os.environ["PREFIX"]
          parts = []
          for p in sorted(out.glob(prefix + ".part-*")):
              parts.append({"name": p.name[len(prefix) + 1:], "sizeBytes": p.stat().st_size,
                            "sha256": hashlib.sha256(p.read_bytes()).hexdigest()})
          manifest = {
              "version": 1, "arch": "amd64", "installerGitRef": os.environ["GIT_REF"],
              "format": "qcow2", "sha256": os.environ["SHA"], "sizeBytes": int(os.environ["SIZE"]),
              "parts": parts, "rawSha256": os.environ["RAW_SHA"], "rawSizeBytes": int(os.environ["RAW_SIZE"]),
              "source": {"name": "debian-13-generic-amd64-${{ inputs.debian_build }}.qcow2", "sha512": os.environ["SOURCE_SHA512"]},
          }
          (out / "FlagshipVMAppliance-amd64.json").write_text(json.dumps(manifest, indent=2) + "\n")
          (out / "R2-KEY-PREFIX.txt").write_text(prefix + "\n")
          print(json.dumps(manifest, indent=2))
          EOF
          ls -la "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: vm-appliance-amd64
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          compression-level: 0

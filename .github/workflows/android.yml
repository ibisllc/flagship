name: android (unit tests + debug APK)

on:
  pull_request:
    paths:
      - "apps/mobile/android/**"
      - "apps/mobile/README.md"
      - "packages/flagship-builder/engine/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/android/**"
      - "apps/mobile/README.md"
      - "packages/flagship-builder/engine/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install shared conformance package
        working-directory: ${{ github.workspace }}
        run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # The action's default package list includes "tools", which current
      # cmdline-tools no longer ship, so sdkmanager exits 1 before any test.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

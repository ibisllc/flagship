name: android (unit tests + debug APK)

on:
  pull_request:
    paths:
      - "apps/mobile/android/**"
      - "apps/mobile/README.md"
      - "packages/flagship-builder/engine/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/android/**"
      - "apps/mobile/README.md"
      - "packages/flagship-builder/engine/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile/android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install shared conformance package
        working-directory: ${{ github.workspace }}
        run: npm ci
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # The action's default package list includes "tools", which current
      # cmdline-tools no longer ship, so sdkmanager exits 1 before any test.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      # Mock clients, fixtures, gym seams and developer mode live in src/debug
      # only; a release build must carry none of them.
      - name: Build release APKs (debug-signed)
        run: ./gradlew --no-daemon :app:assembleRelease :wear:assembleRelease

      - name: Release carries no mock data or developer mode
        run: bash scripts/check-release-clean.sh


  # The every-merge gym on an emulator (docs/ui-test-gym.md): no backend, smoke-mode fixtures, the
  # screens and navigation the unit tests cannot see. Instrumented gyms had no CI before.
  emulator-every-merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile/android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install shared conformance package
        working-directory: ${{ github.workspace }}
        run: npm ci

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Every-merge gym on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          working-directory: apps/mobile/android
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.flagshipserver.app.gym.GymEveryMergeTest

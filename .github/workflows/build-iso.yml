name: Reproducible Flagship ISO build

on:
  push:
    tags:
      - "iso-v*"
  workflow_dispatch:
    inputs:
      alpine_version:
        description: "Alpine release (e.g. 3.21.0). Default = the pinned ALPINE_VERSION in scripts/build-flagship-iso.sh"
        required: false
        default: ""

# Reproducibility hinges on:
#   - Pinned Alpine ISO + sha256 (in scripts/build-flagship-iso.sh).
#   - Pinned ubuntu-runner image (digest pinned via @<sha> in
#     `runs-on: ubuntu-22.04` does NOT pin the image SHA — for stricter
#     guarantees switch to a self-hosted runner with a pinned VM image).
#   - SOURCE_DATE_EPOCH derived from the tag's commit timestamp so file
#     mtimes inside the ISO are deterministic.
#   - xorriso + apk + curl pinned at apt-installed versions for the
#     ubuntu-22.04 runner (acceptable v1; for stricter, use a pinned
#     debian:bookworm-slim docker image).
permissions:
  contents: write   # needed for the release upload step

jobs:
  build:
    runs-on: ubuntu-22.04
    outputs:
      iso_sha256: ${{ steps.build.outputs.iso_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq --no-install-recommends xorriso curl ca-certificates
          xorriso --version | head -1

      - name: Set SOURCE_DATE_EPOCH from commit timestamp
        run: |
          ts=$(git -C "$GITHUB_WORKSPACE" log -1 --pretty=%ct)
          echo "SOURCE_DATE_EPOCH=$ts" >> "$GITHUB_ENV"
          echo "Set SOURCE_DATE_EPOCH=$ts ($(date -u -d @$ts +%FT%TZ))"

      - name: Setup Node + install deps (for the apkovl emitter)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install workspace deps
        run: npm install --no-audit --no-fund

      - name: Build the ISO
        id: build
        env:
          ALPINE_VERSION_OVERRIDE: ${{ github.event.inputs.alpine_version }}
        run: |
          bash scripts/build-flagship-iso.sh out/flagship-base.iso
          sha=$(sha256sum out/flagship-base.iso | awk '{print $1}')
          echo "iso_sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "ISO sha256: $sha"

      - name: Build a SECOND time and assert byte-identical output
        run: |
          mv out/flagship-base.iso out/flagship-base.iso.first
          bash scripts/build-flagship-iso.sh out/flagship-base.iso
          if ! cmp -s out/flagship-base.iso.first out/flagship-base.iso; then
            echo "::error::Reproducibility check FAILED — two builds produced different bytes"
            sha256sum out/flagship-base.iso.first out/flagship-base.iso
            exit 1
          fi
          echo "Reproducibility check OK"

      - name: Upload as workflow artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: flagship-iso-${{ github.sha }}
          path: |
            out/flagship-base.iso
            out/flagship-base.iso.sha256

      - name: Upload to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/iso-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/flagship-base.iso
            out/flagship-base.iso.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true

name: CI (tsc + vitest)

# The core monorepo gate. Until now the two gates that actually decide
# whether the tree is healthy — `npx tsc -b` over the whole workspace and
# the full `npx vitest run` suite (~5000 tests) — only ran by hand. A
# regression could land on main with both green-looking workflows
# (predeploy-check.yml guards routes; e2e.yml runs Playwright) yet a broken
# typecheck or unit suite. This runs them automatically on every PR and on
# pushes to main.
#
# Scope is the TypeScript monorepo only. iOS (xcodebuild) and Android
# (gradle) gates are a deliberate follow-up — they need macOS/JDK runners
# and are run on the owner's machine today.

on:
  pull_request:
  push:
    branches: [main, "release/**"]
  # The full web gym (about 25 minutes) runs here once a day, not on every push.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The unit suite runs in four parallel shards; the typecheck, the vectors and the
  # root-only loop-image test run once, in shard 1.
  gate:
    name: gate (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      # The box's Postgres image, for the database size-limit tests
      # (packages/server-daemon/tests/appQuotaPg.integration.test.ts).
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_PASSWORD: quota
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FLAGSHIP_TEST_PG_URL: postgres://postgres:quota@127.0.0.1:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install workspace deps
        run: npm ci

      - name: Typecheck the whole tree
        run: npx tsc -b

      # The cross-language canonical-byte vectors in test-vectors/canonical-bytes.json
      # are the single source the TS, webapp, Swift, and Kotlin tests all assert
      # against. If a production canonical-byte encoder changes but the generator
      # output isn't regenerated + committed, the fixture goes stale and every
      # client silently asserts old bytes. Fail the build on staleness. (The
      # vitest suite also covers this via canonicalBytesVectorsFresh.test.ts; this
      # is a fast, standalone belt-and-braces check that runs before the suite.)
      - name: Canonical-byte vectors are fresh
        if: matrix.shard == 1
        run: npx tsx tools/test-vectors.ts --check

      - name: Run the unit suite (shard ${{ matrix.shard }} of 4)
        run: npx vitest run --shard=${{ matrix.shard }}/4

      # Cross-client parity (docs/runbooks/release-readiness.md). Report-only
      # while the known gaps it lists get fixed; make it a gate once it is green.
      - name: Cross-client parity (report only)
        if: matrix.shard == 1
        continue-on-error: true
        run: npm run parity -- --report >> "$GITHUB_STEP_SUMMARY"

      # Per-app files folders as real loop-mounted ext4 images, and a real
      # container on one: needs root (packages/server-daemon/tests/
      # appQuotaLoop.integration.test.ts). Last, as it runs as root.
      - name: Files-folder limits on real loop images (root)
        if: matrix.shard == 1
        run: sudo -E env "PATH=$PATH" FLAGSHIP_TEST_LOOP=1 FLAGSHIP_TEST_LOOP_DOCKER=1 npx vitest run packages/server-daemon/tests/appQuotaLoop.integration.test.ts

  # The web gym (docs/ui-test-gym.md, tools/gym/README.md): the real webapp
  # in chromium against a static server with every .com/box call stubbed, so
  # it needs no wrangler, pod-sim or secrets. Pull requests and pushes run
  # the every-merge tranche; the daily schedule, a manual run and pushes to a
  # release/** branch also run the full mock tier (`gym total --mock-only`),
  # the same set `npm run gym:locked` runs here.
  web-gym:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install workspace deps
        run: npm ci

      - name: Build the workspace (so @flagship/* resolve)
        run: npx tsc -b

      - name: Install Chromium for Playwright
        working-directory: apps/web/e2e
        run: npx playwright install --with-deps chromium

      - name: Web gym, every-merge tranche
        env:
          CI: "1"
        run: npm run gym:every-merge -- --surface web

      - name: Web gym, full mock tier
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/release/')
        env:
          CI: "1"
        run: npm run gym:locked -- --surface web

      - name: Upload the gym results (always)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: web-gym-${{ github.sha }}
          path: gym-results
          if-no-files-found: ignore
          retention-days: 14

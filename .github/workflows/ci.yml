name: CI (tsc + vitest)

# The core monorepo gate. Until now the two gates that actually decide
# whether the tree is healthy — `npx tsc -b` over the whole workspace and
# the full `npx vitest run` suite (~5000 tests) — only ran by hand. A
# regression could land on main with both green-looking workflows
# (predeploy-check.yml guards routes; e2e.yml runs Playwright) yet a broken
# typecheck or unit suite. This runs them automatically on every PR and on
# pushes to main.
#
# Scope is the TypeScript monorepo only. iOS (xcodebuild) and Android
# (gradle) gates are a deliberate follow-up — they need macOS/JDK runners
# and are run on the owner's machine today.

on:
  pull_request:
  push:
    branches: [main, "release/**"]
  # The full web gym (about 25 minutes) runs here once a day, not on every push.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a feature or PR branch makes the older run pointless. main and release/* are
# never cancelled: under rapid pushes they would otherwise rarely finish a run, and their result
# is the one a release reads (runs still queue one at a time per branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/release/') && github.ref != 'refs/heads/main' }}

jobs:
  # The unit suite runs in four parallel shards; the typecheck, the vectors and the
  # root-only loop-image test run once, in shard 1.
  gate:
    name: gate (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      # The box's Postgres image, for the database size-limit tests
      # (packages/server-daemon/tests/appQuotaPg.integration.test.ts).
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_PASSWORD: quota
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FLAGSHIP_TEST_PG_URL: postgres://postgres:quota@127.0.0.1:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install workspace deps
        run: npm ci

      - name: Typecheck the whole tree
        run: npx tsc -b

      # The cross-language canonical-byte vectors in test-vectors/canonical-bytes.json
      # are the single source the TS, webapp, Swift, and Kotlin tests all assert
      # against. If a production canonical-byte encoder changes but the generator
      # output isn't regenerated + committed, the fixture goes stale and every
      # client silently asserts old bytes. Fail the build on staleness. (The
      # vitest suite also covers this via canonicalBytesVectorsFresh.test.ts; this
      # is a fast, standalone belt-and-braces check that runs before the suite.)
      - name: Canonical-byte vectors are fresh
        if: matrix.shard == 1
        run: npx tsx tools/test-vectors.ts --check

      # The hybrid admin-root rotation and device-grant companions (pq-suites.md §20): TS, Rust, Swift
      # and Kotlin all read this file, so a stale one fails here first.
      - name: PQ authority vectors are fresh
        if: matrix.shard == 1
        run: npx tsx tools/pq-authority-vectors.ts --check

      # Account master-key rotation (packages/protocol/src/accountKeyRotation.ts): TS, Swift, Kotlin
      # and the webapp read this file.
      - name: Account-key rotation vectors are fresh
        if: matrix.shard == 1
        run: npx tsx tools/account-key-rotation-vectors.ts --check

      # Restore into a running server (docs/restore-into-server.md §4): the stage, plan and undo orders.
      - name: Restore-merge vectors are fresh
        if: matrix.shard == 1
        run: node --import tsx tools/server-restore-merge-vectors.mjs --check

      # Enterprise org authority (docs/enterprise-accounts.md): TS, Swift and Kotlin read this file.
      - name: Org authority vectors are fresh
        if: matrix.shard == 1
        run: npx tsx tools/org-authority-vectors.ts --check

      # The org invite link's keys: offer key, invite key, read and accept proofs (docs/enterprise-accounts.md §7).
      - name: Org invite key vectors are fresh
        if: matrix.shard == 1
        run: npx tsx tools/org-invite-key-vectors.ts --check

      # The org directory, connectors, proposals, standing and members' slices (docs/org-directory.md).
      - name: Org directory vectors are fresh
        if: matrix.shard == 1
        run: npx tsx tools/org-directory-vectors.ts --check

      # keyd adopting a rotated org CGK: the TS and Rust keyd backends both read this file.
      - name: keyd org CGK vectors are fresh
        if: matrix.shard == 1
        run: npx tsx tools/keyd-org-cgk-vectors.ts --check

      # Release plan G2: release/runtime-lock.json and every other Node pin (artifact pins, security floor, box
      # release floors, the box CI jobs) agree, and the signed runtime manifest's shared vectors are current.
      - name: Runtime lock agrees with every Node pin
        if: matrix.shard == 1
        run: npx vitest run scripts/runtime-pins.test.ts && npx tsx tools/runtime-manifest-vectors.ts --check && node tools/runtime-verification-vectors.mjs --check

      - name: Run the unit suite (shard ${{ matrix.shard }} of 4)
        run: npx vitest run --shard=${{ matrix.shard }}/4

      # Cross-client parity (docs/runbooks/release-readiness.md). Report-only
      # while the known gaps it lists get fixed; make it a gate once it is green.
      - name: Cross-client parity (report only)
        if: matrix.shard == 1
        continue-on-error: true
        run: npm run parity -- --report >> "$GITHUB_STEP_SUMMARY"

      # Per-app files folders as real loop-mounted ext4 images, and a real
      # container on one: needs root (packages/server-daemon/tests/
      # appQuotaLoop.integration.test.ts). Last, as it runs as root.
      - name: Files-folder limits on real loop images (root)
        if: matrix.shard == 1
        run: sudo -E env "PATH=$PATH" FLAGSHIP_TEST_LOOP=1 FLAGSHIP_TEST_LOOP_DOCKER=1 npx vitest run packages/server-daemon/tests/appQuotaLoop.integration.test.ts

  # LDAP pull (docs/org-directory.md §4) against a real OpenLDAP server: the box's LdapDirectorySource
  # binds, searches and maps entries the test adds through the same client. The unit suite runs the
  # same code against an in-process fake server; this job proves it against slapd.
  openldap:
    name: LDAP pull against OpenLDAP
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      openldap:
        image: osixia/openldap:1.5.0
        env:
          LDAP_ORGANISATION: Acme
          LDAP_DOMAIN: acme.example
          LDAP_ADMIN_PASSWORD: flagship-ci
        ports:
          - 389:389
        options: >-
          --health-cmd "ldapsearch -x -H ldap://localhost -b dc=acme,dc=example -D cn=admin,dc=acme,dc=example -w flagship-ci -s base"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      FLAGSHIP_TEST_LDAP_URL: ldap://127.0.0.1:389
      FLAGSHIP_TEST_LDAP_BIND_DN: cn=admin,dc=acme,dc=example
      FLAGSHIP_TEST_LDAP_PASSWORD: flagship-ci
      FLAGSHIP_TEST_LDAP_BASE: dc=acme,dc=example
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install workspace deps
        run: npm ci

      - name: Build the daemon's dependencies
        run: npx tsc -b packages/server-daemon

      - name: LDAP pull against slapd
        run: npx vitest run packages/server-daemon/tests/directory.openldap.integration.test.ts

  # The web gym (docs/ui-test-gym.md, tools/gym/README.md): the real webapp
  # in chromium against a static server with every .com/box call stubbed, so
  # it needs no wrangler, pod-sim or secrets. Pull requests and pushes run
  # the every-merge tranche; the daily schedule, a manual run and pushes to a
  # release/** branch also run the full mock tier (`gym total --mock-only`),
  # the same set `npm run gym:locked` runs here.
  web-gym:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install workspace deps
        run: npm ci

      - name: Build the workspace (so @flagship/* resolve)
        run: npx tsc -b

      - name: Install Chromium for Playwright
        working-directory: apps/web/e2e
        run: npx playwright install --with-deps chromium

      - name: Web gym, every-merge tranche
        env:
          CI: "1"
        run: npm run gym:every-merge -- --surface web

      - name: Web gym, full mock tier
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/release/')
        env:
          CI: "1"
        run: npm run gym:locked -- --surface web

      - name: Upload the gym results (always)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: web-gym-${{ github.sha }}
          path: gym-results
          if-no-files-found: ignore
          retention-days: 14

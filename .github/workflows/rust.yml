name: Rust (architecture v2 workspace)

# The Rust trusted core (docs/architecture-v2/IMPLEMENTATION-PLAN.md 5.2, A04): format,
# lint, locked tests and the dependency policy on both box architectures. The toolchain
# comes from rust/rust-toolchain.toml; Cargo.lock is committed and every build is --locked.

on:
  pull_request:
    paths: ["rust/**", "packages/protocol/test-vectors/**", "test-vectors/**", ".github/workflows/rust.yml"]
  push:
    branches: [main, "release/**", "feat/architecture"]
    paths: ["rust/**", "packages/protocol/test-vectors/**", "test-vectors/**", ".github/workflows/rust.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: rust

jobs:
  check:
    name: check (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain from rust-toolchain.toml
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Register gVisor with Docker (the release the box pins, appSandbox/gvisor.ts)
        run: |
          set -eu
          rel=$(sed -n 's/^export const GVISOR_RELEASE = "\(.*\)";/\1/p' "$GITHUB_WORKSPACE/packages/server-daemon/src/appSandbox/gvisor.ts")
          arch=$(uname -m)
          want=$(sed -n "s/^  $arch: \"\([0-9a-f]*\)\",*/\1/p" "$GITHUB_WORKSPACE/packages/server-daemon/src/appSandbox/gvisor.ts")
          test -n "$rel" && test ${#want} -eq 128
          curl -fsSL "https://storage.googleapis.com/gvisor/releases/release/$rel/$arch/gvisor.tar.zstd" -o "$RUNNER_TEMP/gvisor.tar.zstd"
          echo "$want  $RUNNER_TEMP/gvisor.tar.zstd" | sha512sum -c -
          sudo mkdir -p /usr/local/lib/flagship-gvisor
          sudo tar --zstd -xf "$RUNNER_TEMP/gvisor.tar.zstd" -C /usr/local/lib/flagship-gvisor
          sudo /usr/local/lib/flagship-gvisor/runsc install
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}' | grep -q runsc
      - name: Privileged-boundary tests (Linux only, disposable runner)
        run: cargo test --workspace --locked --no-fail-fast -- --ignored linux_ --skip linux_peercred_refuses_another_uid
        env:
          FLAGSHIP_DISPOSABLE_RUNNER: "1"
      - name: Peer-credential test (Linux only, as root)
        run: sudo -E env "PATH=$PATH" cargo test -p flagship-keyd --test hostile --locked -- --ignored --exact linux_peercred_refuses_another_uid
        env:
          FLAGSHIP_DISPOSABLE_RUNNER: "1"

  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rust/Cargo.toml
          command: check advisories licenses bans sources

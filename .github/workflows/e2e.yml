name: e2e (Playwright + pod-sim)

# Runs the webapp → .com → pod-sim end-to-end rig (apps/web/e2e/flows)
# the way its README documents:
#   cd apps/com && npx wrangler dev &        # local miniflare on :8787
#   (wait for it to answer)
#   cd apps/web/e2e && npm test              # Playwright, chromium-only
#
# Notes:
#   - Chromium-only by design (the playwright config has a single
#     `chromium` project).
#   - `wrangler dev` runs in LOCAL miniflare mode: a fresh local D1 (the
#     migrations are applied first, or every D1-backed route 500s with
#     "no such table"), no remote secrets. Most specs stub `.com` with
#     page.route; S11 wipe-restart and S14 hit the local Worker directly.
#   - wrangler is not a repo dependency, so the version is pinned here
#     (WRANGLER_VERSION) instead of floating with `npx wrangler`.
#   - Triggered on pull requests, pushes to main and manual dispatch.
#   - The account read token secret is a throwaway local value so the
#     private reads (/audit, /pods) can be minted and checked (S11).
#   - retries:1 in CI comes from the playwright config; a genuinely flaky
#     spec should be quarantined, not blanket-retried.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      WEBAPP_BASE_URL: http://localhost:8787
      APEX_BASE_URL: http://localhost:8787
      WRANGLER_VERSION: "4.149.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install workspace deps
        run: npm install --no-audit --no-fund

      - name: Build the workspace (so @flagship/* resolve)
        run: npx tsc -b

      - name: Install Chromium for Playwright
        working-directory: apps/web/e2e
        run: npx playwright install --with-deps chromium

      - name: Apply D1 migrations to the local database
        working-directory: apps/com
        run: npx --yes "wrangler@${WRANGLER_VERSION}" d1 migrations apply flagship-state --local

      - name: Start the apex Worker (wrangler dev, local miniflare)
        working-directory: apps/com
        run: |
          set -euo pipefail
          nohup npx --yes "wrangler@${WRANGLER_VERSION}" dev --port 8787 \
            --var ACCOUNT_READ_TOKEN_SECRET:e2e-local-read-token-secret \
            > "$GITHUB_WORKSPACE/wrangler-dev.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/wrangler-dev.pid"

      - name: Wait for wrangler dev to serve the Worker
        run: |
          set -euo pipefail
          pid=$(cat "$GITHUB_WORKSPACE/wrangler-dev.pid")
          for i in $(seq 1 180); do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::wrangler dev exited before it was ready"
              tail -80 "$GITHUB_WORKSPACE/wrangler-dev.log" || true
              exit 1
            fi
            # Ready = the Worker itself answers (not just the port): the
            # health route is JSON from src/, never the static-asset fallback.
            if curl -fsS --max-time 5 "http://localhost:8787/api/health" 2>/dev/null | grep -q '"ok"'; then
              echo "apex up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::wrangler dev never became ready on :8787"
          tail -80 "$GITHUB_WORKSPACE/wrangler-dev.log" || true
          exit 1

      - name: Run the e2e suite (chromium)
        working-directory: apps/web/e2e
        env:
          CI: "1"
        run: npm test

      - name: Stop wrangler dev
        if: always()
        run: |
          pid=$(cat "$GITHUB_WORKSPACE/wrangler-dev.pid" 2>/dev/null || echo "")
          [ -n "$pid" ] && kill "$pid" 2>/dev/null || true
          pkill -f workerd 2>/dev/null || true

      - name: Upload Playwright report + traces (always)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            apps/web/e2e/playwright-report
            apps/web/e2e/test-results
            wrangler-dev.log
          if-no-files-found: ignore
          retention-days: 14

name: retail-vm

# The retail image smoke test (docs/retail-box-setup.md §16.4) in a KVM guest on a GitHub x64 runner:
# the retail layer, keyd's first-start key, the unprivileged claim service and helper, and the claim
# advert seen from a second virtual Bluetooth controller.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/retail-vm.yml"
      - "tools/retail-vm/**"
      - "packages/flagship-builder/src/retailImage.ts"
      - "packages/flagship-builder/src/daemonUnit.ts"
      - "packages/server-daemon/src/retailClaim/**"
      - "packages/boot-chain/src/retailHost.ts"
      - "packages/keyd/src/**"
      - "packages/privd/src/**"
      - "release/security-floor.json"

permissions:
  contents: read

concurrency:
  group: retail-vm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retail-vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Enable KVM
        run: |
          test -e /dev/kvm || { echo "this runner has no /dev/kvm"; exit 1; }
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU and cloud-image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils curl xz-utils

      - name: Read the Node floor
        id: node
        run: echo "version=$(jq -r .node.minimum release/security-floor.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: "npm"

      - name: Retail VM smoke test
        run: bash tools/retail-vm/run.sh "$RUNNER_TEMP/retail-vm"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: retail-vm-logs
          path: |
            ${{ runner.temp }}/retail-vm/serial.log
            ${{ runner.temp }}/retail-vm/user-data
          if-no-files-found: warn
          retention-days: 14
